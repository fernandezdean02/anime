<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./hls.min.js"></script>
</head>
<body>
  <header>
    <a class="back" href="./index.html">← Back</a>
    <span class="brand" id="header-title">Player</span>
  </header>

  <div class="player-wrap">
    <div class="player-main">
      <div class="video-box">
        <video id="video" controls playsinline preload="auto" crossorigin="anonymous"></video>
        <div class="overlay" id="overlay">Loading…</div>
      </div>
      <div class="meta">
        <img id="cover" alt="">
        <div class="meta-text">
          <h2 id="title">Loading…</h2>
          <p id="subtitle"></p>
          <div class="meta-pills">
            <span class="status-pill" id="status-pill">
              <span class="dot"></span><span id="status-text">Idle</span>
            </span>
            <span class="meta-badge" id="meta-provider" hidden></span>
            <span class="meta-badge" id="meta-quality" hidden></span>
          </div>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="card">
        <h3>Content</h3>
        <div class="audio-toggle" id="audio-toggle">
          <button data-type="sub" class="active">Subbed</button>
          <button data-type="dub">Dubbed</button>
        </div>
      </div>

      <div class="card">
        <h3>Audio <span class="badge" id="audio-count">—</span></h3>
        <div class="pills" id="audio-tracks">
          <div class="pill-empty">No audio tracks yet</div>
        </div>
      </div>

      <div class="card">
        <h3>Captions <span class="badge" id="caption-count">—</span></h3>
        <div class="pills" id="caption-tracks">
          <div class="pill-empty">No captions yet</div>
        </div>
      </div>

      <div class="card">
        <h3>Server</h3>
        <select id="provider-select" class="provider-select"></select>
      </div>

      <div class="card" id="vlc-section">
        <h3>External Player</h3>
        <input type="url" id="vlc-url-input" class="vlc-url-input"
               placeholder="Stream URL (auto-fills or paste manually)" autocomplete="off" spellcheck="false">
        <div class="vlc-mode" id="vlc-mode">
          <label><input type="radio" name="vlc-mode" value="raw" checked> <span>Raw CDN</span></label>
          <label><input type="radio" name="vlc-mode" value="proxy"> <span>Proxied</span></label>
        </div>
        <div class="vlc-row">
          <button id="vlc-copy" class="btn-ghost">Copy link</button>
          <button id="vlc-open" class="btn-accent">▶ Open in VLC</button>
        </div>
        <div id="vlc-hint" class="hint" style="margin-top:8px">No stream yet</div>
      </div>

      <div class="card episodes-card">
        <h3>Episodes <span id="ep-source" class="ep-source"></span></h3>
        <div class="ep-list" id="ep-list"><span class="hint">Loading…</span></div>
      </div>

      <button class="retry" id="retry">Retry extraction</button>
    </aside>
  </div>

  <button id="log-toggle" title="Dev log">📋</button>
  <div id="log-panel">
    <div id="log-header">
      <strong>Dev Log</strong>
      <span id="log-count" style="opacity:.6;font-size:11px"></span>
      <span style="flex:1"></span>
      <button id="log-copy">Copy</button>
      <button id="log-clear">Clear</button>
      <button id="log-close">✕</button>
    </div>
    <pre id="log-content"></pre>
  </div>

<style>
/* ═══════ PREMIUM THEME OVERRIDES ═══════ */
:root {
  --glow: rgba(124, 92, 255, 0.35);
  --glass: rgba(24, 24, 34, 0.72);
  --glass-border: rgba(255, 255, 255, 0.06);
}

body {
  background: radial-gradient(1200px 600px at 15% -10%, #1a1430 0%, transparent 55%),
              radial-gradient(900px 500px at 100% 100%, #0d1a2e 0%, transparent 55%),
              var(--bg, #0a0a0f);
  background-attachment: fixed;
}

.player-wrap { gap: 20px; }

/* Video box with premium glow */
.video-box {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.55),
    0 0 100px rgba(124, 92, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.04);
  background: #000;
}
.video-box video {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

/* Meta strip */
.meta {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 16px;
  margin-top: 12px;
  border-radius: 14px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
}
.meta img {
  width: 56px;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
  background: var(--elev, #1a1a24);
  flex: 0 0 auto;
}
.meta-text { min-width: 0; }
.meta-text h2 { font-size: 17px; margin: 0 0 4px; line-height: 1.25; }
.meta-text p { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.meta-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.meta-badge {
  padding: 3px 8px;
  font-size: 10px;
  font-weight: 600;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Status pill */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.status-pill .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.status-pill.playing { color: #10b981; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.25); }
.status-pill.playing .dot { animation: pulse 1.8s ease-in-out infinite; box-shadow: 0 0 8px #10b981; }
.status-pill.loading { color: #f59e0b; background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.25); }
.status-pill.error { color: #ef4444; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.25); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Sidebar cards */
.side {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
}
.side::-webkit-scrollbar { width: 6px; }
.side::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

.card {
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 14px 16px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover { border-color: rgba(124, 92, 255, 0.2); }

.card h3 {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card h3 .badge {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(124, 92, 255, 0.15);
  color: var(--accent, #7c5cff);
  font-weight: 700;
  letter-spacing: 0.04em;
}
.card h3 .badge.empty {
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
}

/* Content audio toggle */
.audio-toggle {
  display: flex;
  gap: 6px;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 10px;
  padding: 4px;
}
.audio-toggle button {
  flex: 1;
  padding: 8px 12px;
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.15s;
}
.audio-toggle button:hover:not(.active) { color: var(--text); }
.audio-toggle button.active {
  background: linear-gradient(135deg, var(--accent, #7c5cff), var(--accent2, #a78bfa));
  color: white;
  box-shadow: 0 2px 8px var(--glow);
}

/* Track pills */
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pill {
  padding: 7px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.pill:hover { background: rgba(124, 92, 255, 0.08); border-color: rgba(124, 92, 255, 0.25); }
.pill.active {
  background: rgba(124, 92, 255, 0.18);
  border-color: var(--accent, #7c5cff);
  color: var(--accent2, #a78bfa);
}
.pill .lang-code {
  font-size: 9px;
  opacity: 0.6;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.pill-empty {
  font-size: 11px;
  color: var(--muted);
  font-style: italic;
  padding: 4px 0;
}

/* Provider select */
.provider-select {
  width: 100%;
  padding: 10px 12px;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}
.provider-select:focus { border-color: var(--accent, #7c5cff); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.12); }

/* VLC section */
.vlc-url-input {
  width: 100%;
  padding: 9px 11px;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 9px;
  color: var(--text);
  font-size: 11px;
  font-family: ui-monospace, Monaco, Consolas, monospace;
  margin-bottom: 10px;
  outline: none;
  box-sizing: border-box;
}
.vlc-url-input:focus { border-color: var(--accent, #7c5cff); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.12); }
.vlc-url-input::placeholder { color: var(--muted); }

.vlc-mode { display: flex; gap: 6px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.25); border-radius: 8px; padding: 3px; }
.vlc-mode label {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.vlc-mode label:has(input:checked) {
  background: rgba(124, 92, 255, 0.15);
  color: var(--accent2, #a78bfa);
}
.vlc-mode input { display: none; }

.vlc-row { display: flex; gap: 8px; }
.btn-ghost, .btn-accent {
  flex: 1;
  padding: 10px 12px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.15s;
}
.btn-ghost {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
}
.btn-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); }
.btn-accent {
  background: linear-gradient(135deg, var(--accent, #7c5cff), var(--accent2, #a78bfa));
  color: white;
  border-color: transparent;
  box-shadow: 0 3px 10px var(--glow);
}
.btn-accent:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 5px 16px var(--glow);
}
.btn-ghost:disabled, .btn-accent:disabled { opacity: 0.5; cursor: not-allowed; }

/* Episodes */
.episodes-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ep-source { font-size: 9px; color: var(--muted); text-transform: none; font-weight: 500; letter-spacing: 0; }
.ep-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 5px;
  overflow-y: auto;
  max-height: 260px;
  padding-right: 2px;
}
.ep-list button {
  padding: 8px 4px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: var(--text);
  border-radius: 7px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.12s;
}
.ep-list button:hover { background: rgba(124, 92, 255, 0.08); border-color: rgba(124, 92, 255, 0.25); }
.ep-list button.active {
  background: linear-gradient(135deg, var(--accent, #7c5cff), var(--accent2, #a78bfa));
  color: white;
  border-color: transparent;
  box-shadow: 0 2px 8px var(--glow);
}

/* Retry */
.retry {
  width: 100%;
  padding: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text);
  border-radius: 11px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.retry:hover { background: rgba(124, 92, 255, 0.08); border-color: rgba(124, 92, 255, 0.3); color: var(--accent2, #a78bfa); }

/* Hint text */
.hint { font-size: 11px; color: var(--muted); line-height: 1.5; }

/* Overlay improvements */
.overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  backdrop-filter: blur(12px);
  background: rgba(10, 10, 15, 0.75);
  font-size: 14px;
  font-weight: 500;
}
.overlay.hidden { display: none !important; }
.overlay button { pointer-events: auto !important; cursor: pointer; }

/* Dev log — keep existing */
#log-toggle{position:fixed;bottom:16px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent,#7c5cff),var(--accent2,#a78bfa));color:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:0 4px 16px var(--glow)}
#log-toggle:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--glow)}
#log-panel{display:none;position:fixed;bottom:76px;right:16px;z-index:9999;width:min(560px,calc(100vw - 32px));max-height:60vh;background:rgba(13,13,18,0.95);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:14px;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#log-panel.open{display:flex}
#log-header{display:flex;gap:6px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--glass-border);font-size:13px}
#log-header button{padding:4px 10px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--glass-border);border-radius:6px;cursor:pointer;font-size:12px}
#log-header button:hover{border-color:var(--accent,#7c5cff)}
#log-content{flex:1;overflow:auto;padding:10px 14px;font:11px/1.5 ui-monospace,Monaco,Consolas,monospace;color:#c8c8d0;white-space:pre-wrap;word-break:break-all;margin:0;max-height:calc(60vh - 48px)}

/* Layout */
.player-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 20px;
  max-width: 1600px;
  margin: 0 auto;
  padding: 20px;
}
@media (max-width: 900px) {
  .player-wrap { grid-template-columns: 1fr; padding: 12px; }
  .side { max-height: none; }
  .ep-list { max-height: 200px; }
}
</style>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const anilistId = Number(params.get('id'));
const startEp   = Number(params.get('ep') || 1);
const startType = params.get('type') === 'dub' ? 'dub' : 'sub';
const STREAM_URL_OVERRIDE = params.get('streamUrl');
const STREAM_REF_OVERRIDE = params.get('streamReferer') || '';

const video    = $('#video');
const overlay  = $('#overlay');
const epList   = $('#ep-list');
const epSource = $('#ep-source');

// ---------------- DEV LOG ----------------
const logLines = [];
const MAX_LOG = 800;
function fmt(v){
  if (v instanceof Error) return v.message;
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v); } catch { return String(v); }
}
function addLog(level, ...args){
  const ts = new Date().toTimeString().slice(0, 8);
  const line = `[${ts}] ${level.padEnd(5)} ${args.map(fmt).join(' ')}`;
  logLines.push(line);
  if (logLines.length > MAX_LOG) logLines.shift();
  const el = document.getElementById('log-content');
  if (el){ el.textContent = logLines.join('\n'); el.scrollTop = el.scrollHeight; }
  const cnt = document.getElementById('log-count');
  if (cnt) cnt.textContent = `(${logLines.length})`;
}
['log','info','warn','error','debug'].forEach(level => {
  const orig = console[level].bind(console);
  console[level] = (...a) => {
    orig(...a);
    addLog(level === 'log' ? 'INFO' : level.toUpperCase(), ...a);
  };
});
window.addEventListener('error', e => addLog('ERROR', 'uncaught:', e.message));
window.addEventListener('unhandledrejection', e =>
  addLog('ERROR', 'unhandled:', e.reason?.message || e.reason));

$('#log-toggle').addEventListener('click', () => $('#log-panel').classList.toggle('open'));
$('#log-close').addEventListener('click', () => $('#log-panel').classList.remove('open'));
$('#log-clear').addEventListener('click', () => {
  logLines.length = 0;
  document.getElementById('log-content').textContent = '';
  document.getElementById('log-count').textContent = '(0)';
  addLog('INFO', 'log cleared');
});
$('#log-copy').addEventListener('click', async () => {
  const text = logLines.join('\n');
  if (!text) return;
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(text);
    else throw 0;
    $('#log-copy').textContent = 'Copied!';
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
    $('#log-copy').textContent = 'Copied!';
  }
  setTimeout(() => $('#log-copy').textContent = 'Copy', 1200);
});
// ---------------- END DEV LOG ----------------

// ---------------- PROVIDER SELECTION ----------------
const ALL_PROVIDERS = ['kaa', 'anizone', 'aniwaves', 'anineko',
                       'animeonsen', 'anikoto', 'mkissa', 'animegg'];
const PROVIDER_LIST = [...new Set(ALL_PROVIDERS)];
const DEFAULT_PROVIDER = 'anizone';
const PROVIDER_STORAGE_KEY = 'provider-pref';

let currentProvider = DEFAULT_PROVIDER;
const urlProvider = params.get('provider');
if (urlProvider){
  currentProvider = urlProvider;
  try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
} else {
  try {
    const saved = sessionStorage.getItem(PROVIDER_STORAGE_KEY);
    if (saved) currentProvider = saved;
  } catch {}
}

function populateProviderSelect(){
  const sel = document.getElementById('provider-select');
  if (!sel) return;
  const list = PROVIDER_LIST.includes(currentProvider)
    ? PROVIDER_LIST
    : [currentProvider, ...PROVIDER_LIST];
  sel.innerHTML = list.map(p =>
    `<option value="${p}"${p === currentProvider ? ' selected' : ''}>${p}</option>`
  ).join('');
  sel.value = currentProvider;
}
populateProviderSelect();

document.getElementById('provider-select').addEventListener('change', (e) => {
  const newProvider = e.target.value;
  if (newProvider === currentProvider) return;
  currentProvider = newProvider;
  try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
  clearExtractCache(anilistId, currentEp, currentType);
  addLog('WARN', `server → ${currentProvider} (re-extracting)`);
  play(true, { deep: false });
});
// ---------------- END PROVIDER SELECTION ----------------

const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='112' height='160'>
     <rect width='100%' height='100%' fill='#1e1e28'/>
     <text x='50%' y='50%' fill='#6a6a80' font-family='sans-serif' font-size='11' text-anchor='middle'>No image</text>
   </svg>`);

const EXTRACT_TIMEOUT_MS    = 105000;
const FULL_RACE_TIMEOUT_MS  = 105000;
const DEEP_RACE_TIMEOUT_MS  = 200000;
const STARTUP_TIMEOUT_MS    = 45000;

const EPS_TTL_MS = 2 * 60 * 60 * 1000;
const EXTRACT_TTL_MS = 5 * 60 * 1000;
const STICKY_TTL_MS = 6 * 60 * 60 * 1000;

const epsKey       = id => `eps:${id}`;
const extractKey   = (id, ep, type) => `x:${id}:${ep}:${type}`;
const stickyKey    = (id, ep, type) => `sticky:${id}:${ep}:${type}`;

let hls = null;
let startupTimer = null;
let episodes = null;
let fakeEpisodes = null;
let currentType = startType;
let currentEp = startEp;
let busy = false;
let overlayTimer = null;
let currentSubs = [];
let currentSubsReferer = null;
let currentStream = { url: '', referer: '', kind: 'hls', provider: '' };
let currentAudioTrack = -1;
let currentCaptionTrack = -1;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

// ---------------- STATUS PILL ----------------
function setStatus(text, state = 'idle'){
  const pill = document.getElementById('status-pill');
  const txt = document.getElementById('status-text');
  if (!pill || !txt) return;
  pill.className = 'status-pill' + (state !== 'idle' ? ' ' + state : '');
  txt.textContent = text;
}
function setMetaBadge(id, text){
  const el = document.getElementById(id);
  if (!el) return;
  if (text){ el.textContent = text; el.hidden = false; }
  else { el.hidden = true; }
}
// ---------------- END STATUS ----------------

// ---------------- AUDIO / CAPTION TRACK UI ----------------
function langName(code){
  if (!code) return '';
  try {
    const d = new Intl.DisplayNames(['en'], { type: 'language' });
    const n = d.of(code);
    if (n && n !== code) return n;
  } catch {}
  return code;
}

function updateAudioTracks(){
  const container = document.getElementById('audio-tracks');
  const countEl = document.getElementById('audio-count');
  if (!container) return;

  let tracks = [];
  if (hls && hls.audioTracks && hls.audioTracks.length > 0){
    tracks = hls.audioTracks.map((t, i) => ({
      name: t.name || t.lang || `Track ${i + 1}`,
      lang: t.lang || '',
      index: i,
      isDefault: t.default || i === 0,
    }));
    currentAudioTrack = hls.audioTrack;
  }

  if (!tracks.length){
    // No multi-audio — show "Original" as single item
    const kind = currentStream.kind || 'hls';
    const isVideo = currentStream.url && currentStream.url.length > 0;
    if (isVideo){
      container.innerHTML = `
        <button class="pill active" disabled>
          <span>Original</span>
          <span class="lang-code">${kind.toUpperCase()}</span>
        </button>`;
      if (countEl) { countEl.textContent = '1'; countEl.classList.remove('empty'); }
    } else {
      container.innerHTML = `<div class="pill-empty">No audio tracks yet</div>`;
      if (countEl) { countEl.textContent = '—'; countEl.classList.add('empty'); }
    }
    return;
  }

  const activeIdx = hls && typeof hls.audioTrack === 'number' ? hls.audioTrack : currentAudioTrack;
  container.innerHTML = tracks.map(t => `
    <button class="pill ${t.index === activeIdx ? 'active' : ''}" data-audio-index="${t.index}">
      <span>${esc(t.name)}</span>
      ${t.lang ? `<span class="lang-code">${esc(t.lang)}</span>` : ''}
    </button>`).join('');
  if (countEl) { countEl.textContent = String(tracks.length); countEl.classList.remove('empty'); }

  container.querySelectorAll('button[data-audio-index]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.audioIndex, 10);
      if (hls && hls.audioTracks && hls.audioTracks[idx]){
        hls.audioTrack = idx;
        currentAudioTrack = idx;
        addLog('INFO', `audio → ${hls.audioTracks[idx].name || hls.audioTracks[idx].lang}`);
        updateAudioTracks();
      }
    });
  });
}

function updateCaptionTracks(){
  const container = document.getElementById('caption-tracks');
  const countEl = document.getElementById('caption-count');
  if (!container) return;

  const subs = currentSubs || [];

  if (!subs.length){
    container.innerHTML = `<div class="pill-empty">No captions in this stream</div>`;
    if (countEl) { countEl.textContent = '0'; countEl.classList.add('empty'); }
    return;
  }

  const items = [
    { label: 'Off', lang: '', index: -1 },
    ...subs.map((s, i) => ({
      label: s.label || `Track ${i + 1}`,
      lang: s.srclang || s.lang || '',
      index: i,
    })),
  ];

  container.innerHTML = items.map(t => `
    <button class="pill ${t.index === currentCaptionTrack ? 'active' : ''}" data-caption-index="${t.index}">
      <span>${esc(t.label)}</span>
      ${t.lang ? `<span class="lang-code">${esc(t.lang)}</span>` : ''}
    </button>`).join('');
  if (countEl) { countEl.textContent = String(subs.length); countEl.classList.remove('empty'); }

  container.querySelectorAll('button[data-caption-index]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.captionIndex, 10);
      applyCaptionTrack(idx);
    });
  });
}

function applyCaptionTrack(idx){
  [...video.querySelectorAll('track')].forEach(t => t.remove());
  currentCaptionTrack = idx;
  if (idx === -1){
    addLog('INFO', 'captions off');
    updateCaptionTracks();
    return;
  }
  const s = currentSubs[idx];
  if (!s){ addLog('WARN', `caption ${idx} missing`); return; }
  addLog('INFO', `captions → ${s.label}`);
  const t = document.createElement('track');
  t.kind = 'subtitles';
  t.label = s.label || `Track ${idx + 1}`;
  t.srclang = s.srclang || 'en';
  t.src = proxySeg(s.url, currentSubsReferer);
  t.default = true;
  video.appendChild(t);
  setTimeout(() => {
    const tracks = video.textTracks;
    for (let i = 0; i < tracks.length; i++) tracks[i].mode = 'showing';
  }, 200);
  updateCaptionTracks();
}

function vlcUrlInputEl(){ return document.getElementById('vlc-url-input'); }
function vlcMode(){
  const el = document.querySelector('input[name="vlc-mode"]:checked');
  return el ? el.value : 'raw';
}
function vlcRawUrl(){ return currentStream.url || null; }
function vlcProxyUrl(){
  if (!currentStream.url) return null;
  const u = encodeURIComponent(currentStream.url);
  const r = currentStream.referer ? `&referer=${encodeURIComponent(currentStream.referer)}` : '';
  if (currentStream.kind === 'mp4') return `${location.origin}/p/seg?url=${u}${r}`;
  return `${location.origin}/p/m3u8?url=${u}${r}&abs=1`;
}
function vlcUrl(){ return vlcMode() === 'proxy' ? vlcProxyUrl() : vlcRawUrl(); }

function updateVlcHint(){
  const hint = document.getElementById('vlc-hint');
  if (!hint) return;
  if (!currentStream.url){
    hint.textContent = 'No stream yet — extracting or paste URL manually';
    return;
  }
  const mode = vlcMode();
  const parts = [mode === 'proxy' ? 'Proxied' : 'Raw',
                 String(currentStream.kind || 'hls').toUpperCase()];
  if (currentStream.provider) parts.push(currentStream.provider);
  hint.textContent = parts.join(' · ');
}

function setVlcStream(url, referer, kind, provider){
  currentStream = {
    url: url || '',
    referer: referer || '',
    kind: kind || 'hls',
    provider: provider || '',
  };
  const inp = vlcUrlInputEl();
  if (inp) inp.value = currentStream.url;
  updateVlcHint();
}
function clearVlcStream(){
  currentStream = { url: '', referer: '', kind: 'hls', provider: '' };
  const inp = vlcUrlInputEl();
  if (inp) inp.value = '';
  updateVlcHint();
}

(function bindVlcInput(){
  const inp = vlcUrlInputEl();
  if (!inp) return;
  inp.addEventListener('input', e => {
    const v = e.target.value.trim();
    currentStream.url = v;
    if (/\.mp4(\?|$)/i.test(v)) currentStream.kind = 'mp4';
    else if (/\.m3u8(\?|$)/i.test(v)) currentStream.kind = 'hls';
    updateVlcHint();
  });
})();

async function copyToClipboard(text){
  try {
    if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; }
  } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

async function copyVlcLink(){
  const link = vlcUrl();
  if (!link){ addLog('WARN', 'no VLC link available'); return; }
  const btn = document.getElementById('vlc-copy');
  const ok = await copyToClipboard(link);
  if (ok){
    addLog('OK', `copied [${vlcMode()}] ${link.length} chars`);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy link', 1400);
  } else {
    window.prompt('Copy this URL and paste in VLC → New stream:', link);
  }
}

async function openInVlc(){
  if (!currentStream.url){
    addLog('WARN', 'no URL — extract in progress or paste manually');
    window.alert('No stream URL yet. Wait for extract, or paste a URL into the field above.');
    return;
  }
  const mode = vlcMode();
  const btn = document.getElementById('vlc-open');
  const orig = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Opening…'; }
  try {
    const u = encodeURIComponent(currentStream.url);
    const r = currentStream.referer ? `&referer=${encodeURIComponent(currentStream.referer)}` : '';
    const resp = await fetch(`/open?url=${u}${r}&kind=${currentStream.kind}&mode=${mode}`);

    if (!resp.ok){
      const txt = await resp.text().catch(() => '');

      // Auto-copy so user can immediately paste in VLC manually
      const link = vlcUrl();
      const copied = link ? await copyToClipboard(link) : false;
      addLog('ERROR', `VLC launch failed [${mode}]: HTTP ${resp.status} — copied=${copied}`);

      const msg = copied
        ? `VLC couldn't be launched automatically (${resp.status}).\n\n✓ The URL has been copied to your clipboard.\n\nOpen VLC → Menu (☰) → New stream → Paste → Play.\n\n${txt.slice(0, 200)}`
        : `VLC couldn't be launched (${resp.status}).\n\nCopy the URL manually:\n${link || ''}\n\n${txt.slice(0, 200)}`;
      window.alert(msg);
      return;
    }

    const j = await resp.json().catch(() => ({}));
    addLog('OK', `VLC open [${mode}] → ${(j.target || '').slice(0, 100)}`);
    if (btn){ btn.textContent = '✓ Sent to VLC'; setTimeout(() => btn.textContent = orig || '▶ Open in VLC', 1500); }
  } catch(e){
    addLog('ERROR', `VLC launch error: ${e.message}`);
    window.alert('VLC launch error: ' + e.message);
  } finally {
    if (btn && !btn.textContent.startsWith('✓')){ btn.disabled = false; btn.textContent = orig || '▶ Open in VLC'; }
    else if (btn) { setTimeout(() => { btn.disabled = false; btn.textContent = '▶ Open in VLC'; }, 1500); }
  }
}

document.getElementById('vlc-copy').addEventListener('click', copyVlcLink);
document.getElementById('vlc-open').addEventListener('click', openInVlc);
document.getElementById('vlc-mode').addEventListener('change', updateVlcHint);

function getCachedExtract(id, ep, type){
  try {
    const raw = sessionStorage.getItem(extractKey(id, ep, type));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > EXTRACT_TTL_MS) return null;
    return data;
  } catch { return null; }
}
function cacheExtract(id, ep, type, data){
  try { sessionStorage.setItem(extractKey(id, ep, type),
    JSON.stringify({ data, ts: Date.now() })); } catch {}
}
function clearExtractCache(id, ep, type){
  try { sessionStorage.removeItem(extractKey(id, ep, type)); } catch {}
}

function getSticky(id, ep, type){
  try {
    const raw = localStorage.getItem(stickyKey(id, ep, type));
    if (!raw) return null;
    const { url, referer, ts } = JSON.parse(raw);
    if (Date.now() - ts > STICKY_TTL_MS) return null;
    return { url, referer };
  } catch { return null; }
}
function saveSticky(id, ep, type, url, referer){
  try {
    localStorage.setItem(stickyKey(id, ep, type),
      JSON.stringify({ url, referer, ts: Date.now() }));
    addLog('INFO', `sticky saved for ep=${ep} (${type})`);
  } catch {}
}
function clearSticky(id, ep, type){
  try { localStorage.removeItem(stickyKey(id, ep, type)); } catch {}
}

async function tryProvider(ep, type, provider, nc){
  addLog('INFO', `prov: ${provider}${nc ? ' [fresh]' : ''}`);
  try {
    const data = await fetchJSON(
      `/anime/extract/${anilistId}?e=${ep}&type=${type}&provider=${provider}${nc}`,
      EXTRACT_TIMEOUT_MS,
      `extract:${provider}`
    );
    const stream = (data.streams || []).find(s => s.isActive !== false);
    if (!stream){ addLog('WARN', `${provider}: empty streams`); return null; }
    if (isEmbedStream(stream)){ addLog('WARN', `${provider}: embed only`); return null; }
    if (!isHlsStream(stream) && !isMp4Stream(stream)){
      addLog('WARN', `${provider}: unknown type "${stream.type}"`); return null;
    }
    addLog('OK', `✓ ${provider} → ${stream.type || 'hls'}`);
    return data;
  } catch(e){
    addLog('WARN', `${provider} failed: ${e.message}`);
    return null;
  }
}

async function fullRace(ep, type, { deep = false, nocache = false } = {}){
  const nc = nocache ? '&nocache=1' : '';
  const d = deep ? '&deep=1' : '';
  const raceMs = deep ? DEEP_RACE_TIMEOUT_MS : FULL_RACE_TIMEOUT_MS;
  const label = deep ? `Deep race (${raceMs/1000}s)` : `Full race (${raceMs/1000}s)`;
  showOverlay('', false, label);
  setStatus('Racing providers', 'loading');
  addLog('INFO', `${deep ? 'DEEP' : 'FULL'} race ep=${ep}`);
  return await fetchJSON(
    `/anime/extract/${anilistId}?e=${ep}&type=${type}${nc}${d}`,
    raceMs + 5000,
    deep ? 'deep-race' : 'race'
  );
}

async function extractFast(ep, type, { silent = false, nocache = false, deep = false } = {}){
  const cached = !nocache && getCachedExtract(anilistId, ep, type);
  if (cached){
    addLog('INFO', `extract ep=${ep} [cache hit] provider=${cached.provider}`);
    return cached;
  }
  if (silent) return null;

  const nc = nocache ? '&nocache=1' : '';
  const provider = currentProvider;

  addLog('INFO', `using server: ${provider}`);
  const data = await tryProvider(ep, type, provider, nc);
  if (data){ cacheExtract(anilistId, ep, type, data); return data; }
  if (provider !== DEFAULT_PROVIDER){
    throw new Error(`Server "${provider}" has no playable stream. Pick another server.`);
  }
  addLog('WARN', `${provider} empty — full race`);
  const raceData = await fullRace(ep, type, { deep, nocache });
  if (!raceData.streams?.length) throw new Error('No streams from any provider');
  cacheExtract(anilistId, ep, type, raceData);
  addLog('OK', `race won by ${raceData.provider}`);
  return raceData;
}

function proxyM3U8(url, referer){
  let p = `/p/m3u8?url=${encodeURIComponent(url)}`;
  if (referer) p += `&referer=${encodeURIComponent(referer)}`;
  return p;
}
function proxySeg(url, referer){
  let p = `/p/seg?url=${encodeURIComponent(url)}`;
  if (referer) p += `&referer=${encodeURIComponent(referer)}`;
  return p;
}

function getCachedEpisodes(id){
  try {
    const raw = sessionStorage.getItem(epsKey(id));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > EPS_TTL_MS) return null;
    return data;
  } catch { return null; }
}
function cacheEpisodes(id, data){
  try { sessionStorage.setItem(epsKey(id), JSON.stringify({ data, ts: Date.now() })); } catch {}
}

function episodesFor(type){
  if (episodes?.providers){
    for (const key of Object.keys(episodes.providers)){
      const list = episodes.providers[key]?.episodes?.[type];
      if (list?.length) return list;
    }
  }
  if (fakeEpisodes) return fakeEpisodes;
  return [];
}

function renderEpisodes(){
  const list = episodesFor(currentType);
  if (!list.length){
    epList.innerHTML = `<span class="hint">No ${currentType} episodes available.</span>`;
    return;
  }
  epList.innerHTML = list.map(e =>
    `<button data-ep="${e.number}" class="${e.number===currentEp?'active':''}">${e.number}</button>`
  ).join('');
  const active = epList.querySelector('button.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
  epSource.textContent = episodes ? '' : '(estimated)';
}

function pickFallbackEp(type){
  const list = episodesFor(type);
  if (!list.length) return null;
  return list.some(e => e.number===currentEp) ? currentEp : list[0].number;
}

async function loadEpisodesBackground(){
  const cached = getCachedEpisodes(anilistId);
  if (cached){
    episodes = cached;
    const fb = pickFallbackEp(currentType);
    if (fb && !params.get('ep')) currentEp = fb;
    renderEpisodes();
    addLog('INFO', 'episodes from cache');
    return;
  }
  addLog('INFO', 'loading episodes…');
  try {
    const data = await fetchJSON(`/anime/episodes/${anilistId}`, 130000, 'episodes');
    episodes = data;
    cacheEpisodes(anilistId, data);
    const fb = pickFallbackEp(currentType);
    if (fb && !params.get('ep')) currentEp = fb;
    renderEpisodes();
    addLog('OK', 'episodes list loaded');
  } catch(e){
    addLog('ERROR', `episodes failed: ${e.message}`);
  }
}

function attachSubtitles(subs, referer){
  [...video.querySelectorAll('track')].forEach(t => t.remove());
  currentSubs = subs || [];
  currentSubsReferer = referer;
  currentCaptionTrack = -1;
  updateCaptionTracks();
  if (currentSubs.length){
    addLog('INFO', `CC: ${currentSubs.length} track(s)`);
  }
}

function clearStartupTimer(){
  if (startupTimer){ clearTimeout(startupTimer); startupTimer = null; }
}

function showOverlay(msg, err=false, timerPrefix=null){
  overlay.innerHTML = '';
  overlay.classList.toggle('err', err);
  overlay.classList.remove('hidden');

  if (timerPrefix){
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    spinner.style.cssText = 'width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent,#7c5cff);border-radius:50%;animation:spin 0.8s linear infinite';
    overlay.appendChild(spinner);

    const start = Date.now();
    const text = document.createElement('div');
    text.textContent = `${timerPrefix}… 0s`;
    text.style.cssText = 'margin-top:8px;font-size:13px;color:var(--muted);font-weight:500';
    overlay.appendChild(text);
    if (overlayTimer) clearInterval(overlayTimer);
    overlayTimer = setInterval(() => {
      text.textContent = `${timerPrefix}… ${Math.round((Date.now()-start)/1000)}s`;
    }, 1000);
  } else {
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    if (msg){
      const text = document.createElement('div');
      text.textContent = msg;
      overlay.appendChild(text);
    }
  }

  if (!err && currentStream && currentStream.url){
    const btn = document.createElement('button');
    btn.textContent = '▶ Open in VLC (faster)';
    btn.className = 'btn-accent';
    btn.style.cssText =
      'margin-top:16px;padding:12px 24px;max-width:280px;' +
      'border-radius:10px;font-size:14px;font-weight:700;cursor:pointer';
    btn.addEventListener('click', (e) => { e.stopPropagation(); openInVlc(); });
    overlay.appendChild(btn);
  }
}

const styleSheet = document.createElement('style');
styleSheet.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(styleSheet);

function hideOverlay(){
  if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
  overlay.classList.add('hidden');
  overlay.innerHTML = '';
}

function playFromData(data){
  const active = (data.streams || []).filter(s => s.isActive !== false);
  const stream = active.find(isHlsStream)
              || active.find(isMp4Stream)
              || active[0]
              || (data.streams && data.streams[0]);
  if (!stream){ showProviderError('any', 'No streams in response'); return; }

  const subs = stream.subtitles || data.subtitles || [];
  const provider = data.provider || currentProvider;
  addLog('INFO', `stream: provider=${provider} type=${stream.type || 'hls'} subs=${subs.length}`);

  if (isEmbedStream(stream)){
    showProviderError(provider, 'returned embed (iframe), not playable');
    return;
  }

  setMetaBadge('meta-provider', provider);
  setMetaBadge('meta-quality', stream.type === 'mp4' ? 'MP4' : 'HLS');

  if (isHlsStream(stream)){
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    setVlcStream(stream.url, stream.referer, 'hls', provider);
    showOverlay('Connecting…');
    setStatus('Loading HLS', 'loading');
    loadHls(proxyM3U8(stream.url, stream.referer), subs, stream.referer, provider, stream.url);
  } else if (isMp4Stream(stream)){
    setVlcStream(stream.url, stream.referer, 'mp4', provider);
    showOverlay('Connecting (MP4)…', false);
    setStatus('Loading MP4', 'loading');
    loadMp4(stream, subs, provider);
  } else {
    showProviderError(provider, `unsupported type "${stream.type}"`);
  }
  history.replaceState(null, '', `?id=${anilistId}&ep=${currentEp}&type=${currentType}`);
}

async function play(nocache = false, { deep = false } = {}){
  if (busy) return;
  busy = true;

  const sticky = getSticky(anilistId, currentEp, currentType);
  if (sticky){
    const kind = /\.mp4(\?|$)/i.test(sticky.url) ? 'mp4' : 'hls';
    setVlcStream(sticky.url, sticky.referer, kind, 'sticky');
    addLog('INFO', 'VLC prepopulated from sticky cache');
  } else {
    clearVlcStream();
  }

  renderEpisodes();
  setStatus('Extracting', 'loading');
  addLog('INFO', `play ep=${currentEp} type=${currentType} nocache=${nocache} deep=${deep}`);

  if (STREAM_URL_OVERRIDE){
    addLog('INFO', `using URL override (bypass extract)`);
    const subs = [];
    const overrideKind = /\.mp4(\?|$)/i.test(STREAM_URL_OVERRIDE) ? 'mp4' : 'hls';
    setVlcStream(STREAM_URL_OVERRIDE, STREAM_REF_OVERRIDE, overrideKind, 'override');
    setMetaBadge('meta-provider', 'override');
    showOverlay('Connecting to override URL…');
    setStatus('Override', 'loading');
    loadHls(proxyM3U8(STREAM_URL_OVERRIDE, STREAM_REF_OVERRIDE), subs, STREAM_REF_OVERRIDE, 'override', STREAM_URL_OVERRIDE);
    busy = false;
    return;
  }

  const cached = !nocache && getCachedExtract(anilistId, currentEp, currentType);
  showOverlay(cached ? 'Loading stream…' : '', false, cached ? null : 'Extracting stream');

  try {
    const data = await extractFast(currentEp, currentType, { nocache, deep });
    if (!data) throw new Error('No stream');
    playFromData(data);
  } catch(e){
    addLog('WARN', `extract failed: ${e.message}`);
    if (sticky){
      addLog('WARN', `using sticky URL`);
      showOverlay('Trying cached URL…');
      loadHls(proxyM3U8(sticky.url, sticky.referer), [], sticky.referer, 'sticky', sticky.url);
    } else {
      addLog('ERROR', `play failed: ${e.message}`);
      showProviderError(currentProvider,
        e.message + ' — or paste a URL into the External Player field');
    }
  } finally { busy = false; }
}

function showProviderError(provider, reason){
  if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
  clearStartupTimer();
  setStatus('Failed', 'error');

  overlay.classList.add('err');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;padding:0 20px;text-align:center">
      <div style="font-size:15px;font-weight:700">Stream failed · <span style="color:var(--accent2,#a78bfa)">${esc(provider)}</span></div>
      <div style="font-size:12px;opacity:.75;line-height:1.55">${esc(reason || 'Manifest did not load')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px">
        ${currentStream && currentStream.url
          ? '<button id="overlay-vlc" class="btn-accent" style="padding:10px 20px;max-width:180px">▶ Play in VLC</button>'
          : ''}
        <button id="overlay-reload" class="btn-ghost" style="padding:10px 18px;max-width:120px">Reload</button>
        <button id="overlay-next" class="btn-ghost" style="padding:10px 18px;max-width:130px">Next server</button>
        <button id="overlay-back" class="btn-ghost" style="padding:10px 18px;max-width:100px">Back</button>
      </div>
    </div>`;

  const vlcBtn = document.getElementById('overlay-vlc');
  if (vlcBtn) vlcBtn.addEventListener('click', (e) => { e.stopPropagation(); openInVlc(); });
  const reloadBtn = document.getElementById('overlay-reload');
  if (reloadBtn) reloadBtn.addEventListener('click', () => location.reload());
  const nextBtn = document.getElementById('overlay-next');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const idx = PROVIDER_LIST.indexOf(currentProvider);
    const next = PROVIDER_LIST[(idx + 1) % PROVIDER_LIST.length];
    currentProvider = next;
    try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
    const sel = document.getElementById('provider-select');
    if (sel) sel.value = currentProvider;
    clearExtractCache(anilistId, currentEp, currentType);
    addLog('WARN', `switched to ${currentProvider}, retrying`);
    play(true, { deep: false });
  });
  const backBtn = document.getElementById('overlay-back');
  if (backBtn) backBtn.addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = './index.html';
  });
}

function loadMp4(stream, subs, provider){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  attachSubtitles(subs, stream.referer);
  video.src = proxySeg(stream.url, stream.referer);
  video.load();

  startupTimer = setTimeout(() => {
    if (video.readyState < 2){
      showProviderError(provider, 'MP4 source did not start');
    }
  }, 8000);

  const onPlaying = () => {
    clearStartupTimer(); hideOverlay();
    setStatus('Playing', 'playing');
    saveSticky(anilistId, currentEp, currentType, stream.url, stream.referer);
    updateAudioTracks(); // refresh (single audio for mp4)
    video.removeEventListener('playing', onPlaying);
  };
  video.addEventListener('playing', onPlaying);

  video.addEventListener('error', () => {
    clearStartupTimer();
    const code = video.error?.code;
    showProviderError(provider, `MP4 failed (code ${code})`);
  }, { once:true });

  video.play().catch(()=>{});
}

function loadHls(src, subs, referer, provider, rawUrl){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  attachSubtitles(subs, referer);

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      startLevel: 0,
      testBandwidth: false,
      startFragPrefetch: true,
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      maxBufferSize: 40 * 1000 * 1000,
      maxBufferHole: 0.5,
      abrEwmaDefaultEstimate: 2000000,
      abrBandWidthFactor: 0.85,
      abrBandWidthUpFactor: 0.7,
      abrMaxWithRealBitrate: true,
      capLevelToPlayerSize: true,
      maxAutoLevel: 2,
      manifestLoadingTimeOut: 25000,
      manifestLoadingMaxRetry: 2,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 80000,
      levelLoadingMaxRetry: 3,
      levelLoadingRetryDelay: 600,
      levelLoadingMaxRetryTimeout: 10000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 800,
      fragLoadingMaxRetryTimeout: 64000,
      appendErrorMaxRetry: 3,
      maxStarvationDelay: 4,
      maxLoadingDelay: 4,
      backBufferLength: 30,
    });
    hls.loadSource(src);
    hls.attachMedia(video);

    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => {
      addLog('INFO', `audio tracks: ${hls.audioTracks?.length || 0}`);
      updateAudioTracks();
    });
    hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, () => updateAudioTracks());

    startupTimer = setTimeout(() => {
      if (video.readyState < 2){
        addLog('ERROR', `startup timeout ${STARTUP_TIMEOUT_MS/1000}s`);
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);

    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => {
      addLog('OK', `HLS manifest parsed (${d.levels?.length ?? '?'} levels)`);
      if (hls.levels && hls.levels.length){
        const cap = hls.levels
          .map((l, i) => ({ h: l.height || 0, i }))
          .filter(x => x.h > 0 && x.h <= 720)
          .pop();
        if (cap && cap.i < hls.levels.length - 1){
          hls.autoLevelCapping = cap.i;
        }
        const maxHeight = hls.levels[hls.levels.length - 1]?.height;
        if (maxHeight) setMetaBadge('meta-quality', `${maxHeight}p`);
      }
      showOverlay('Buffering…');
      updateAudioTracks();
      video.play().catch(()=>{});
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => {
      const h = hls.levels[d.level]?.height;
      if (h) setMetaBadge('meta-quality', `${h}p`);
    });

    const onPlaying = () => {
      clearStartupTimer(); hideOverlay();
      setStatus('Playing', 'playing');
      if (rawUrl) saveSticky(anilistId, currentEp, currentType, rawUrl, referer);
      video.removeEventListener('playing', onPlaying);
    };
    video.addEventListener('playing', onPlaying);

    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      addLog('ERROR', `HLS ${d.type} ${d.details}`);
      clearStartupTimer();
      if (/manifest/i.test(d.details || '')){
        if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
        clearSticky(anilistId, currentEp, currentType);
        addLog('WARN', `manifest failed on ${provider} — clearing sticky cache`);
        showProviderError(provider, `Manifest did not load (${d.details})`);
        return;
      }
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR){
        showOverlay('Network error, retrying…', true);
        hls.startLoad();
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR){
        showOverlay('Media error, recovering…', true);
        hls.recoverMediaError();
      } else {
        showProviderError(provider, `Playback failed: ${d.details}`);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    addLog('INFO', 'using native HLS');
    video.src = src;
    startupTimer = setTimeout(() => {
      if (video.readyState < 2){
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);
    const onPlaying = () => {
      clearStartupTimer(); hideOverlay();
      setStatus('Playing', 'playing');
      if (rawUrl) saveSticky(anilistId, currentEp, currentType, rawUrl, referer);
      updateAudioTracks();
      video.removeEventListener('playing', onPlaying);
    };
    video.addEventListener('playing', onPlaying);
    video.addEventListener('error', () => {
      clearStartupTimer();
      showProviderError(provider, 'Native HLS failed');
    });
    video.play().catch(()=>{});
  } else {
    showProviderError(provider, 'HLS not supported in this browser');
  }
}

async function loadMeta(){
  try {
    const info = await fetchJSON(`/anime/info/${anilistId}`, 30000, 'info');
    const t = info.title?.english || info.title?.romaji || 'Unknown';
    $('#title').textContent = t;
    $('#header-title').textContent = t;
    document.title = t + ' · Player';
    const img = info.coverImage?.large || info.coverImage?.extraLarge || PLACEHOLDER;
    $('#cover').src = img;
    $('#cover').onerror = () => { $('#cover').src = PLACEHOLDER; };
    $('#subtitle').textContent = [
      info.format, info.seasonYear, info.episodes ? info.episodes+' ep' : null
    ].filter(Boolean).join(' · ');
    if (info.episodes > 0 && !episodes){
      fakeEpisodes = Array.from({ length: info.episodes }, (_, i) => ({ number: i + 1 }));
      renderEpisodes();
    }
  } catch(e){
    addLog('WARN', `meta failed: ${e.message}`);
    $('#title').textContent = 'Anime #' + anilistId;
  }
}

$('#audio-toggle').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-type]');
  if (!b || b.dataset.type === currentType) return;
  currentType = b.dataset.type;
  [...$('#audio-toggle').children].forEach(x => x.classList.toggle('active', x===b));
  const fb = pickFallbackEp(currentType);
  if (fb) currentEp = fb;
  play();
});

epList.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-ep]');
  if (!b) return;
  const n = Number(b.dataset.ep);
  if (n === currentEp) return;
  currentEp = n;
  play();
});

$('#retry').addEventListener('click', () => {
  clearExtractCache(anilistId, currentEp, currentType);
  addLog('WARN', 'manual retry');
  play(true, { deep: false });
});

(async function boot(){
  if (!anilistId){ showOverlay('Missing ?id= in URL', true); return; }
  [...$('#audio-toggle').children].forEach(x =>
    x.classList.toggle('active', x.dataset.type === currentType));
  addLog('INFO', `anilistId=${anilistId} ep=${startEp} type=${startType} provider=${currentProvider}`);
  if (STREAM_URL_OVERRIDE){
    addLog('INFO', `STREAM_URL_OVERRIDE active → bypass extract`);
  }
  loadMeta();
  loadEpisodesBackground();
  play();
})();
</script>
