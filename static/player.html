<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <title>Player</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./hls.min.js"></script>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  </script>
</head>
<body>
  <header>
    <a class="back" href="./index.html">← Back</a>
    <span class="brand" id="header-title">Player</span>
  </header>

  <div class="player-wrap">
    <div class="player-main">
      <div class="video-box" id="video-box">
        <video id="video" playsinline webkit-playsinline preload="auto"></video>

        <!-- Double-tap zones (left/right) -->
        <div class="vjs-tap-zone vjs-tap-left" id="vjs-tap-left"></div>
        <div class="vjs-tap-zone vjs-tap-right" id="vjs-tap-right"></div>

        <div id="subtitle-overlay"></div>

        <!-- Ripple feedback for double-tap -->
        <div class="vjs-ripple vjs-ripple-left" id="vjs-ripple-left">
          <div class="vjs-ripple-arrows">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </div>
          <div class="vjs-ripple-secs">10s</div>
        </div>
        <div class="vjs-ripple vjs-ripple-right" id="vjs-ripple-right">
          <div class="vjs-ripple-arrows">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
          <div class="vjs-ripple-secs">10s</div>
        </div>

        <!-- Center controls (now with prev/next) -->
        <div class="vjs-center-controls" id="vjs-center-controls">
          <button class="vjs-center-btn vjs-center-ep" id="vjs-prev-center" title="Previous episode" aria-label="Previous episode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="vjs-center-btn vjs-center-side" id="vjs-rew-center" title="Rewind 10s" aria-label="Rewind 10 seconds">
            <svg id="vjs-rew-svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span class="vjs-skip-label-big">10</span>
          </button>
          <button class="vjs-center-btn vjs-center-play" id="vjs-play-center" title="Play" aria-label="Play">
            <svg id="vjs-play-center-icon" width="54" height="54" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
          <button class="vjs-center-btn vjs-center-side" id="vjs-fwd-center" title="Forward 10s" aria-label="Forward 10 seconds">
            <svg id="vjs-fwd-svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span class="vjs-skip-label-big">10</span>
          </button>
          <button class="vjs-center-btn vjs-center-ep" id="vjs-next-center" title="Next episode" aria-label="Next episode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
        </div>

        <div class="vjs-toast" id="vjs-toast"></div>

        <!-- Bottom controls -->
        <div class="vjs-controls" id="vjs-controls">
          <div class="vjs-progress-wrap" id="vjs-progress-wrap">
            <div class="vjs-progress-buffered" id="vjs-progress-buffered"></div>
            <div class="vjs-progress-played" id="vjs-progress-played"></div>
            <div class="vjs-progress-thumb" id="vjs-progress-thumb"></div>
          </div>
          <div class="vjs-bar">
            <div class="vjs-bar-left">
              <button class="vjs-btn" id="vjs-prev" title="Previous episode" aria-label="Previous episode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button class="vjs-btn" id="vjs-rew" title="Rewind 10s" aria-label="Rewind 10 seconds">
                <svg id="vjs-rew-svg-bottom" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                <span class="vjs-skip-label">10</span>
              </button>
              <button class="vjs-btn vjs-play" id="vjs-play" title="Play" aria-label="Play">
                <svg id="vjs-play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
              </button>
              <button class="vjs-btn" id="vjs-fwd" title="Forward 10s" aria-label="Forward 10 seconds">
                <svg id="vjs-fwd-svg-bottom" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                <span class="vjs-skip-label">10</span>
              </button>
              <button class="vjs-btn" id="vjs-next" title="Next episode" aria-label="Next episode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
              </button>
              <span class="vjs-time" id="vjs-time">0:00 / 0:00</span>
            </div>
            <div class="vjs-bar-right">
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-vol-btn" title="Volume" aria-label="Volume">
                  <svg id="vjs-vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                </button>
                <div class="vjs-pop" id="vjs-vol-pop">
                  <div class="vjs-pop-title">Volume <span id="vjs-vol-val">100%</span></div>
                  <input type="range" id="vjs-vol-range" min="0" max="300" step="5" value="100">
                </div>
              </div>
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-bright-btn" title="Brightness" aria-label="Brightness">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
                </button>
                <div class="vjs-pop" id="vjs-bright-pop">
                  <div class="vjs-pop-title">Brightness <span id="vjs-bright-val">100%</span></div>
                  <input type="range" id="vjs-bright-range" min="30" max="200" step="5" value="100">
                </div>
              </div>
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-cc-btn" title="Captions" aria-label="Captions">CC</button>
                <div class="vjs-pop vjs-menu" id="vjs-cc-pop">
                  <div class="vjs-pop-title">Captions</div>
                  <select id="vjs-cc-select"><option value="-1">Off</option></select>
                  <button class="vjs-menu-btn
