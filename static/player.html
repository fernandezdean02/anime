<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <title>Player</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./hls.min.js"></script>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  </script>
</head>
<body>
  <header>
    <a class="back" href="./index.html">← Back</a>
    <span class="brand" id="header-title">Player</span>
  </header>

  <div class="player-wrap">
    <div class="player-main">
      <div class="video-box" id="video-box">
        <!-- native controls removed -->
        <video id="video" playsinline webkit-playsinline preload="auto"></video>
        <div id="subtitle-overlay"></div>

        <!-- ============ NEW: custom in-video controls ============ -->
        <div class="vjs-controls" id="vjs-controls">
          <div class="vjs-progress-wrap" id="vjs-progress-wrap">
            <div class="vjs-progress-buffered" id="vjs-progress-buffered"></div>
            <div class="vjs-progress-played" id="vjs-progress-played"></div>
            <div class="vjs-progress-thumb" id="vjs-progress-thumb"></div>
          </div>
          <div class="vjs-bar">
            <div class="vjs-bar-left">
              <button class="vjs-btn" id="vjs-prev" title="Previous episode" aria-label="Previous episode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button class="vjs-btn" id="vjs-rew" title="Rewind 10s" aria-label="Rewind 10 seconds">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                <span class="vjs-skip-label">10</span>
              </button>
              <button class="vjs-btn vjs-play" id="vjs-play" title="Play" aria-label="Play">
                <svg id="vjs-play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
              </button>
              <button class="vjs-btn" id="vjs-fwd" title="Forward 10s" aria-label="Forward 10 seconds">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                <span class="vjs-skip-label">10</span>
              </button>
              <button class="vjs-btn" id="vjs-next" title="Next episode" aria-label="Next episode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
              </button>
              <span class="vjs-time" id="vjs-time">0:00 / 0:00</span>
            </div>
            <div class="vjs-bar-right">
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-vol-btn" title="Volume" aria-label="Volume">
                  <svg id="vjs-vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                </button>
                <div class="vjs-pop" id="vjs-vol-pop">
                  <div class="vjs-pop-title">Volume <span id="vjs-vol-val">100%</span></div>
                  <input type="range" id="vjs-vol-range" min="0" max="300" step="5" value="100">
                </div>
              </div>
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-bright-btn" title="Brightness" aria-label="Brightness">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
                </button>
                <div class="vjs-pop" id="vjs-bright-pop">
                  <div class="vjs-pop-title">Brightness <span id="vjs-bright-val">100%</span></div>
                  <input type="range" id="vjs-bright-range" min="30" max="200" step="5" value="100">
                </div>
              </div>
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-cc-btn" title="Captions" aria-label="Captions">CC</button>
                <div class="vjs-pop vjs-menu" id="vjs-cc-pop">
                  <div class="vjs-pop-title">Captions</div>
                  <select id="vjs-cc-select"><option value="-1">Off</option></select>
                  <button class="vjs-menu-btn" id="vjs-cc-style">Caption style…</button>
                </div>
              </div>
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-audio-btn" title="Audio" aria-label="Audio">Audio</button>
                <div class="vjs-pop vjs-menu" id="vjs-audio-pop">
                  <div class="vjs-pop-title">Audio / Content</div>
                  <select id="vjs-audio-select"></select>
                </div>
              </div>
              <div class="vjs-pop-wrap">
                <button class="vjs-btn" id="vjs-settings-btn" title="Settings" aria-label="Settings">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <div class="vjs-pop vjs-menu" id="vjs-settings-pop">
                  <div class="vjs-pop-title">Quality</div>
                  <select id="vjs-quality-select"><option value="-1">Auto</option></select>
                  <label class="vjs-menu-check"><input type="checkbox" id="vjs-autoplay"> Autoplay next episode</label>
                </div>
              </div>
              <button class="vjs-btn" id="vjs-fs-btn" title="Fullscreen" aria-label="Fullscreen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
              </button>
            </div>
          </div>
        </div>
        <!-- ============ /NEW ============ -->

        <div class="overlay" id="overlay">Loading…</div>
      </div>
      <div class="meta">
        <div class="cover-wrap"><img id="cover" alt="" loading="lazy"></div>
        <div class="meta-text">
          <h2 id="title">Loading…</h2>
          <p id="subtitle"></p>
          <div class="meta-pills">
            <span class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text">Idle</span></span>
            <span class="meta-badge" id="meta-provider">—</span>
            <span class="meta-badge" id="meta-quality">—</span>
          </div>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="card"><h3>Audio <span class="badge empty" id="audio-count">—</span></h3><select id="audio-select" class="track-select"></select></div>
      <div class="card" id="quality-card"><h3>Quality <span class="badge empty" id="quality-count">—</span></h3><select id="quality-select" class="track-select" disabled><option value="-1">Auto</option></select></div>
      <div class="card" id="cc-section">
        <h3>
          <span>Captions <span class="badge empty" id="caption-count">—</span></span>
          <button id="cc-settings-toggle" class="cc-toggle" type="button" title="Caption settings" aria-label="Caption settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </h3>
        <div class="caption-settings" id="caption-settings" hidden>
          <div class="cs-row"><div class="cs-label"><span>Size</span><span class="cs-val" id="cc-size-val">100%</span></div><input type="range" id="cc-size" min="50" max="200" step="5" value="100"></div>
          <div class="cs-row"><div class="cs-label"><span>Font</span></div>
            <select id="cc-font" class="cs-select"><option value="system">System</option><option value="sans">Sans Serif</option><option value="serif">Serif</option><option value="mono">Monospace</option></select>
          </div>
          <div class="cs-row"><div class="cs-label"><span>Text Color</span></div><input type="color" id="cc-color" value="#ffffff" class="cs-color"></div>
          <div class="cs-row"><div class="cs-label"><span>Background</span></div><input type="color" id="cc-bg" value="#000000" class="cs-color"></div>
          <div class="cs-row"><div class="cs-label"><span>BG Opacity</span><span class="cs-val" id="cc-bg-opacity-val">75%</span></div><input type="range" id="cc-bg-opacity" min="0" max="100" step="5" value="75"></div>
          <div class="cs-row"><div class="cs-label"><span>Position</span><span class="cs-val" id="cc-position-val">10%</span></div><input type="range" id="cc-position" min="2" max="60" step="1" value="10"></div>
          <button id="cc-reset" class="cc-reset" type="button">Reset to defaults</button>
        </div>
        <select id="caption-select" class="track-select" disabled><option value="-1">Off</option></select>
      </div>
      <div class="card"><h3>Server</h3><select id="provider-select" class="track-select"></select></div>
      <div class="card">
        <h3>Playback</h3>
        <div class="slider-row"><label for="volume-slider">Volume</label><input type="range" id="volume-slider" min="0" max="300" step="5" value="100"><span class="slider-value" id="volume-value">100%</span></div>
        <div class="slider-row"><label for="brightness-slider">Brightness</label><input type="range" id="brightness-slider" min="30" max="200" step="5" value="100"><span class="slider-value" id="brightness-value">100%</span></div>
      </div>
      <div class="card episodes-card" id="episodes-card">
        <h3 class="episodes-header" id="episodes-header" role="button" tabindex="0" aria-expanded="false" aria-controls="ep-list">
          <span class="ep-title">Episodes</span>
          <span id="ep-source" class="ep-source"></span>
          <svg class="ep-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </h3>
        <div class="ep-list" id="ep-list"><span class="hint">Loading episodes…</span></div>
      </div>
      <button class="retry" id="retry">Retry extraction</button>
    </aside>
  </div>

  <button id="log-toggle" title="Dev log">📋</button>
  <div id="log-panel">
    <div id="log-header">
      <strong>Dev Log</strong>
      <span id="log-count" style="opacity:.6;font-size:11px"></span>
      <span style="flex:1"></span>
      <button id="log-copy">Copy</button>
      <button id="log-clear">Clear</button>
      <button id="log-close">✕</button>
    </div>
    <pre id="log-content"></pre>
  </div>

<style>
/* ═══════ DARK SCROLLBARS ═══════ */
* { scrollbar-width: thin; scrollbar-color: rgba(124,92,255,0.35) rgba(255,255,255,0.03); }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 4px; }
*::-webkit-scrollbar-thumb { background: rgba(124,92,255,0.28); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-thumb:hover { background: rgba(124,92,255,0.5); background-clip: padding-box; }
*::-webkit-scrollbar-corner { background: transparent; }
select, input, textarea, button, option { color-scheme: dark; }

/* ═══════ THEME ═══════ */
:root { --glow: rgba(124,92,255,0.35); --glass: rgba(24,24,34,0.72); --glass-border: rgba(255,255,255,0.06); }
html, body { margin: 0; }
body {
  background: radial-gradient(1200px 600px at 15% -10%, #1a1430 0%, transparent 55%),
              radial-gradient(900px 500px at 100% 100%, #0d1a2e 0%, transparent 55%),
              var(--bg, #0a0a0f);
  background-attachment: fixed;
  color: var(--text, #e0e0e8);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--glass-border);
  background: rgba(8,8,12,0.72);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 100;
}
header .back {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--text); text-decoration: none;
  font-size: 13px; font-weight: 600;
  padding: 7px 12px; border-radius: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  transition: all .18s;
}
header .back:hover { border-color: var(--accent, #7c5cff); }
header .brand {
  flex: 1; text-align: center; font-size: 14px; font-weight: 700;
  background: linear-gradient(135deg, var(--text) 20%, var(--accent, #7c5cff) 130%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.player-wrap { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 20px; max-width: 1600px; margin: 0 auto; padding: 20px; }

/* ═══════ VIDEO BOX ═══════ */
.video-box {
  position: relative; border-radius: 16px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 100px rgba(124,92,255,0.08);
  border: 1px solid rgba(255,255,255,0.04);
  background: #000; aspect-ratio: 16 / 9;
}
.video-box video { display: block; width: 100%; height: 100%; background: #000; object-fit: contain; transition: filter .15s ease; }

#subtitle-overlay {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: 10%; max-width: 90%; padding: 6px 14px; border-radius: 6px;
  background: rgba(0,0,0,0.75); color: #fff; font-size: 16px; line-height: 1.35;
  text-align: center; pointer-events: none; z-index: 3;
  white-space: pre-wrap; text-shadow: 0 1px 2px rgba(0,0,0,0.8); display: none;
}

/* ═══════ CUSTOM IN-VIDEO CONTROLS ═══════ */
.vjs-controls {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 44px 14px 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.42) 55%, rgba(0,0,0,0) 100%);
  z-index: 5; opacity: 0; transition: opacity 0.25s;
  pointer-events: none; user-select: none;
}
.vjs-controls.visible { opacity: 1; pointer-events: auto; }

.vjs-progress-wrap {
  position: relative; height: 16px; display: flex; align-items: center;
  cursor: pointer; margin-bottom: 6px; touch-action: none;
}
.vjs-progress-wrap::before {
  content: ''; position: absolute; left: 0; right: 0; height: 4px;
  background: rgba(255,255,255,0.18); border-radius: 2px; transition: height .15s;
}
.vjs-progress-wrap:hover::before,
.vjs-progress-wrap.dragging::before { height: 6px; }
.vjs-progress-buffered, .vjs-progress-played {
  position: absolute; left: 0; height: 4px; border-radius: 2px;
  pointer-events: none; transition: height .15s;
}
.vjs-progress-wrap:hover .vjs-progress-buffered,
.vjs-progress-wrap:hover .vjs-progress-played,
.vjs-progress-wrap.dragging .vjs-progress-buffered,
.vjs-progress-wrap.dragging .vjs-progress-played { height: 6px; }
.vjs-progress-buffered { background: rgba(255,255,255,0.32); width: 0%; }
.vjs-progress-played { background: linear-gradient(90deg, #7c5cff, #a78bfa); width: 0%; }
.vjs-progress-thumb {
  position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 3px rgba(124,92,255,0.4);
  transform: translateX(-50%); pointer-events: none; left: 0%;
  opacity: 0; transition: opacity .15s;
}
.vjs-progress-wrap:hover .vjs-progress-thumb,
.vjs-progress-wrap.dragging .vjs-progress-thumb { opacity: 1; }

.vjs-bar { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.vjs-bar-left, .vjs-bar-right { display: flex; align-items: center; gap: 2px; min-width: 0; }

.vjs-btn {
  background: none; border: none; color: #fff;
  width: 36px; height: 36px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 12px; font-weight: 700; padding: 0;
  transition: background .15s, transform .1s;
  position: relative; flex-shrink: 0;
}
.vjs-btn:hover { background: rgba(255,255,255,0.12); }
.vjs-btn:active { transform: scale(0.94); }
.vjs-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.vjs-btn:disabled:hover { background: none; }
.vjs-btn.active { color: #a78bfa; text-shadow: 0 0 8px rgba(167,139,250,0.5); }
.vjs-play { width: 42px; height: 42px; }
.vjs-skip-label {
  position: absolute; font-size: 8px; font-weight: 800; bottom: 8px; pointer-events: none;
}
.vjs-time {
  font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85);
  margin: 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* audio + cc button labels sized */
#vjs-audio-btn { width: auto; padding: 0 10px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
#vjs-cc-btn { font-size: 11px; letter-spacing: 0.03em; }

/* ═══════ POPUPS ═══════ */
.vjs-pop-wrap { position: relative; }
.vjs-pop {
  position: absolute; bottom: calc(100% + 8px); right: 0;
  background: rgba(20,20,28,0.97); backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  padding: 12px; min-width: 200px; display: none; z-index: 10;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.vjs-pop.open { display: block; }
.vjs-pop-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: rgba(255,255,255,0.6); margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.vjs-pop-title span { color: #a78bfa; font-variant-numeric: tabular-nums; }
.vjs-pop input[type="range"] {
  width: 100%; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px;
  outline: none; -webkit-appearance: none; appearance: none; cursor: pointer; accent-color: #7c5cff;
}
.vjs-pop input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: linear-gradient(135deg, #7c5cff, #a78bfa); cursor: pointer;
  box-shadow: 0 0 0 3px rgba(124,92,255,0.2);
}
.vjs-pop select {
  width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
  color: #e0e0e8; font-size: 12px; font-weight: 600; cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23a0a0b0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px;
}
.vjs-menu-btn {
  width: 100%; margin-top: 8px; padding: 8px;

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const anilistId = Number(params.get('id'));
const startEp   = Number(params.get('ep') || 1);
const startType = params.get('type') === 'dub' ? 'dub' : 'sub';
const STREAM_URL_OVERRIDE = params.get('streamUrl');
const STREAM_REF_OVERRIDE = params.get('streamReferer') || '';

const video    = $('#video');
const overlay  = $('#overlay');
const epList   = $('#ep-list');
const epSource = $('#ep-source');

/* ---------------- DEV LOG ---------------- */
const logLines = [];
const MAX_LOG = 800;
function fmt(v){ if (v instanceof Error) return v.message; if (typeof v === 'string') return v; try { return JSON.stringify(v); } catch { return String(v); } }
function addLog(level, ...args){
  const ts = new Date().toTimeString().slice(0,8);
  const line = `[${ts}] ${level.padEnd(5)} ${args.map(fmt).join(' ')}`;
  logLines.push(line);
  if (logLines.length > MAX_LOG) logLines.shift();
  const el = document.getElementById('log-content');
  if (el){ el.textContent = logLines.join('\n'); el.scrollTop = el.scrollHeight; }
  const cnt = document.getElementById('log-count');
  if (cnt) cnt.textContent = `(${logLines.length})`;
}
['log','info','warn','error','debug'].forEach(level => {
  const orig = console[level].bind(console);
  console[level] = (...a) => { orig(...a); addLog(level === 'log' ? 'INFO' : level.toUpperCase(), ...a); };
});
window.addEventListener('error', e => addLog('ERROR', 'uncaught:', e.message));
window.addEventListener('unhandledrejection', e => addLog('ERROR', 'unhandled:', e.reason?.message || e.reason));
$('#log-toggle').addEventListener('click', () => $('#log-panel').classList.toggle('open'));
$('#log-close').addEventListener('click', () => $('#log-panel').classList.remove('open'));
$('#log-clear').addEventListener('click', () => { logLines.length = 0; document.getElementById('log-content').textContent = ''; document.getElementById('log-count').textContent = '(0)'; addLog('INFO', 'log cleared'); });
$('#log-copy').addEventListener('click', async () => {
  const text = logLines.join('\n');
  if (!text) return;
  try { if (navigator.clipboard) await navigator.clipboard.writeText(text); else throw 0; $('#log-copy').textContent = 'Copied!'; }
  catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove(); $('#log-copy').textContent = 'Copied!'; }
  setTimeout(() => $('#log-copy').textContent = 'Copy', 1200);
});
/* ---------------- END DEV LOG ---------------- */

/* ---------------- SCROLL HELPERS ---------------- */
function scrollToVideo(smooth = true){
  if (window.innerWidth > 900) return;
  const box = document.getElementById('video-box');
  if (!box) return;
  const headerH = document.querySelector('header')?.offsetHeight || 0;
  const y = window.scrollY + box.getBoundingClientRect().top - headerH;
  window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
}
function scrollActiveIntoEpList(smooth = false){
  const active = epList.querySelector('button.active');
  if (!active) return;
  const cRect = epList.getBoundingClientRect();
  const bRect = active.getBoundingClientRect();
  if (bRect.top < cRect.top || bRect.bottom > cRect.bottom){
    const offset = active.offsetTop - epList.clientHeight / 2 + active.clientHeight / 2;
    epList.scrollTo({ top: Math.max(0, offset), behavior: smooth ? 'smooth' : 'auto' });
  }
}
/* ---------------- END SCROLL HELPERS ---------------- */

/* ---------------- PROVIDERS ---------------- */
const ALL_PROVIDERS = ['kaa','anizone','aniwaves','anineko','animeonsen','anikoto','mkissa','animegg','anibd'];
const PROVIDER_LIST = [...new Set(ALL_PROVIDERS)];
const DEFAULT_PROVIDER = 'anizone';
const PROVIDER_STORAGE_KEY = 'provider-pref';
let currentProvider = DEFAULT_PROVIDER;
const urlProvider = params.get('provider');
if (urlProvider){ currentProvider = urlProvider; try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {} }
else { try { const saved = sessionStorage.getItem(PROVIDER_STORAGE_KEY); if (saved) currentProvider = saved; } catch {} }
function populateProviderSelect(){
  const sel = document.getElementById('provider-select');
  if (!sel) return;
  const list = PROVIDER_LIST.includes(currentProvider) ? PROVIDER_LIST : [currentProvider, ...PROVIDER_LIST];
  sel.innerHTML = list.map(p => `<option value="${p}"${p === currentProvider ? ' selected' : ''}>${p}</option>`).join('');
  sel.value = currentProvider;
}
populateProviderSelect();
document.getElementById('provider-select').addEventListener('change', (e) => {
  const newProvider = e.target.value;
  if (newProvider === currentProvider) return;
  currentProvider = newProvider;
  try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
  clearExtractCache(anilistId, currentEp, currentType);
  addLog('WARN', `server → ${currentProvider}`);
  scrollToVideo();
  play(true, { deep: false });
});
/* ---------------- END PROVIDERS ---------------- */

const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300'><rect width='100%' height='100%' fill='#1e1e28'/><text x='50%' y='55%' fill='#6a6a80' font-family='sans-serif' font-size='12' text-anchor='middle'>No cover</text></svg>`);

const EXTRACT_TIMEOUT_MS = 30000;
const FULL_RACE_TIMEOUT_MS = 55000;
const DEEP_RACE_TIMEOUT_MS = 65000;
const STARTUP_TIMEOUT_MS = 20000;
const STICKY_FRESH_MS = 60 * 60 * 1000;
const EPS_TTL_MS = 2 * 60 * 60 * 1000;
const EXTRACT_TTL_MS = 5 * 60 * 1000;
const STICKY_TTL_MS = 6 * 60 * 60 * 1000;
const epsKey = id => `eps:${id}`;
const extractKey = (id, ep, type) => `x:${id}:${ep}:${type}`;
const stickyKey = (id, ep, type) => `sticky:${id}:${ep}:${type}`;

let hls = null;
let startupTimer = null;
let episodes = null;
let fakeEpisodes = null;
let currentType = startType;
let currentEp = startEp;
let busy = false;
let overlayTimer = null;
let currentSubs = [];
let currentSubsReferer = null;
let currentCaptionTrack = -1;
let subtitleCues = [];
let autoplayNext = false;
try { autoplayNext = localStorage.getItem('player-autoplay-next') === '1'; } catch {}

let audioCtx = null;
let audioSourceNode = null;
let audioGainNode = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ---------------- STATUS ---------------- */
function setStatus(text, state = 'idle'){
  const pill = document.getElementById('status-pill');
  const txt = document.getElementById('status-text');
  if (!pill || !txt) return;
  pill.className = 'status-pill' + (state !== 'idle' ? ' ' + state : '');
  txt.textContent = text;
}
function setMetaBadge(id, text){ const el = document.getElementById(id); if (el) el.textContent = text || '—'; }
/* ---------------- END STATUS ---------------- */

/* ---------------- CAPTION SETTINGS ---------------- */
const CC_SETTINGS_KEY = 'player-caption-settings';
const CC_DEFAULTS = { size: 100, font: 'system', color: '#ffffff', bgColor: '#000000', bgOpacity: 75, position: 10 };
let captionSettings = { ...CC_DEFAULTS };
function loadCaptionSettings(){
  try { const raw = localStorage.getItem(CC_SETTINGS_KEY); if (raw){ const parsed = JSON.parse(raw); captionSettings = { ...CC_DEFAULTS, ...parsed }; } } catch {}
}
function saveCaptionSettings(){ try { localStorage.setItem(CC_SETTINGS_KEY, JSON.stringify(captionSettings)); } catch {} }
function hexToRgba(hex, alpha){
  hex = String(hex || '#000').replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.slice(0,2),16) || 0;
  const g = parseInt(hex.slice(2,4),16) || 0;
  const b = parseInt(hex.slice(4,6),16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}
const FONT_MAP = {
  system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif',
  sans: 'Helvetica, Arial, "Segoe UI", sans-serif',
  serif: 'Georgia, "Times New Roman", serif',
  mono: '"Courier New", Consolas, monospace',
};
function applyCaptionSettings(){
  const el = document.getElementById('subtitle-overlay');
  if (!el) return;
  const videoH = video.clientHeight || video.getBoundingClientRect().height || 360;
  const fs = Math.max(12, Math.round((videoH / 22) * (captionSettings.size / 100)));
  const bg = hexToRgba(captionSettings.bgColor, captionSettings.bgOpacity / 100);
  el.style.fontSize = fs + 'px';
  el.style.fontFamily = FONT_MAP[captionSettings.font] || FONT_MAP.system;
  el.style.color = captionSettings.color;
  el.style.background = bg;
  el.style.bottom = captionSettings.position + '%';
  el.style.display = el.textContent ? 'block' : 'none';
}
function syncCaptionControls(){
  const s = captionSettings;
  document.getElementById('cc-size').value = s.size;
  document.getElementById('cc-size-val').textContent = s.size + '%';
  document.getElementById('cc-font').value = s.font;
  document.getElementById('cc-color').value = s.color;
  document.getElementById('cc-bg').value = s.bgColor;
  document.getElementById('cc-bg-opacity').value = s.bgOpacity;
  document.getElementById('cc-bg-opacity-val').textContent = s.bgOpacity + '%';
  document.getElementById('cc-position').value = s.position;
  document.getElementById('cc-position-val').textContent = s.position + '%';
}
(function bindCaptionSettings(){
  const inpSize = document.getElementById('cc-size');
  const inpFont = document.getElementById('cc-font');
  const inpColor = document.getElementById('cc-color');
  const inpBg = document.getElementById('cc-bg');
  const inpBgOp = document.getElementById('cc-bg-opacity');
  const inpPos = document.getElementById('cc-position');
  const resetBtn = document.getElementById('cc-reset');
  const toggleBtn = document.getElementById('cc-settings-toggle');
  const panel = document.getElementById('caption-settings');
  inpSize.addEventListener('input', () => { captionSettings.size = parseInt(inpSize.value,10); document.getElementById('cc-size-val').textContent = captionSettings.size + '%'; applyCaptionSettings(); saveCaptionSettings(); });
  inpFont.addEventListener('change', () => { captionSettings.font = inpFont.value; applyCaptionSettings(); saveCaptionSettings(); });
  inpColor.addEventListener('input', () => { captionSettings.color = inpColor.value; applyCaptionSettings(); saveCaptionSettings(); });
  inpBg.addEventListener('input', () => { captionSettings.bgColor = inpBg.value; applyCaptionSettings(); saveCaptionSettings(); });
  inpBgOp.addEventListener('input', () => { captionSettings.bgOpacity = parseInt(inpBgOp.value,10); document.getElementById('cc-bg-opacity-val').textContent = captionSettings.bgOpacity + '%'; applyCaptionSettings(); saveCaptionSettings(); });
  inpPos.addEventListener('input', () => { captionSettings.position = parseInt(inpPos.value,10); document.getElementById('cc-position-val').textContent = captionSettings.position + '%'; applyCaptionSettings(); saveCaptionSettings(); });
  resetBtn.addEventListener('click', () => { captionSettings = { ...CC_DEFAULTS }; syncCaptionControls(); applyCaptionSettings(); saveCaptionSettings(); });
  const CC_PANEL_OPEN_KEY = 'player-caption-settings-open';
  let isOpen = false; try { isOpen = localStorage.getItem(CC_PANEL_OPEN_KEY) === '1'; } catch {}
  if (isOpen){ panel.hidden = false; toggleBtn.classList.add('active'); }
  toggleBtn.addEventListener('click', () => { const open = panel.hidden; panel.hidden = !open; toggleBtn.classList.toggle('active', open); try { localStorage.setItem(CC_PANEL_OPEN_KEY, open ? '1' : '0'); } catch {} });
  loadCaptionSettings();
  syncCaptionControls();
  applyCaptionSettings();
  window.addEventListener('resize', () => applyCaptionSettings());
})();

/* ---------------- SUBTITLE PARSER / RENDERER ---------------- */
function parseVTT(text){
  const cues = [];
  if (!text) return cues;
  const clean = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const blocks = clean.split(/\n{2,}/);
  const timeRe = /(\d{1,2}):(\d{2}):(\d{2})[.,](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[.,](\d{3})/;
  const toSec = (h,m,s,ms) => parseInt(h,10)*3600 + parseInt(m,10)*60 + parseInt(s,10) + parseInt(ms,10)/1000;
  for (const block of blocks){
    const lines = block.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) continue;
    let idx = -1;
    for (let i = 0; i < lines.length; i++){ if (lines[i].includes('-->')) { idx = i; break; } }
    if (idx < 0) continue;
    const match = lines[idx].match(timeRe);
    if (!match) continue;
    const start = toSec(match[1],match[2],match[3],match[4]);
    const end = toSec(match[5],match[6],match[7],match[8]);
    const text = lines.slice(idx + 1).join('\n').replace(/<[^>]+>/g,'').trim();
    if (text && end > start) cues.push({ start, end, text });
  }
  return cues;
}
function updateSubtitleOverlay(){
  const el = document.getElementById('subtitle-overlay');
  if (!el) return;
  if (currentCaptionTrack === -1 || !subtitleCues.length){
    if (el.textContent) el.textContent = '';
    if (el.style.display !== 'none') el.style.display = 'none';
    return;
  }
  const t = video.currentTime;
  const cue = subtitleCues.find(c => t >= c.start && t <= c.end);
  const next = cue ? cue.text : '';
  if (next !== el.textContent) el.textContent = next;
  el.style.display = next ? 'block' : 'none';
}
video.addEventListener('timeupdate', updateSubtitleOverlay);
video.addEventListener('seeked', updateSubtitleOverlay);

/* ---------------- AUDIO GRAPH / VOLUME / BRIGHTNESS ---------------- */
function ensureAudioGraph(){
  if (audioCtx) return true;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    audioCtx = new Ctx();
    audioSourceNode = audioCtx.createMediaElementSource(video);
    audioGainNode = audioCtx.createGain();
    audioGainNode.gain.value = 1.0;
    audioSourceNode.connect(audioGainNode);
    audioGainNode.connect(audioCtx.destination);
    addLog('INFO', 'audio graph created');
    return true;
  } catch(e){ addLog('WARN', `audio graph failed: ${e.message}`); audioCtx = null; return false; }
}
function applyVolume(pct){
  const clamped = Math.max(0, Math.min(300, pct));
  if (clamped === 0){ video.muted = true; video.volume = 0; if (audioGainNode) audioGainNode.gain.value = 0; return; }
  video.muted = false;
  if (clamped <= 100 && !audioCtx){ video.volume = clamped / 100; return; }
  if (!ensureAudioGraph()){ video.volume = Math.min(1, clamped / 100); return; }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  video.volume = 1.0;
  audioGainNode.gain.value = clamped / 100;
}
function applyBrightness(pct){
  const b = Math.max(30, Math.min(200, pct));
  video.style.filter = b === 100 ? '' : `brightness(${b/100})`;
  try { localStorage.setItem('player-brightness', String(b)); } catch {}
}

const volumeSlider = document.getElementById('volume-slider');
const volumeValue  = document.getElementById('volume-value');
const brightnessSlider = document.getElementById('brightness-slider');
const brightnessValue  = document.getElementById('brightness-value');

try {
  const savedVol = parseInt(localStorage.getItem('player-volume') || '100', 10);
  if (Number.isFinite(savedVol) && savedVol >= 0 && savedVol <= 300){
    volumeSlider.value = String(savedVol);
    volumeValue.textContent = savedVol + '%';
    if (savedVol !== 100) applyVolume(savedVol);
  }
  const savedBright = parseInt(localStorage.getItem('player-brightness') || '100', 10);
  if (Number.isFinite(savedBright) && savedBright >= 30 && savedBright <= 200){
    brightnessSlider.value = String(savedBright);
    brightnessValue.textContent = savedBright + '%';
    applyBrightness(savedBright);
  }
} catch {}

function setVolume(v){
  v = Math.max(0, Math.min(300, v));
  volumeSlider.value = String(v);
  volumeValue.textContent = v + '%';
  const vRange = document.getElementById('vjs-vol-range');
  const vVal = document.getElementById('vjs-vol-val');
  if (vRange) vRange.value = String(v);
  if (vVal) vVal.textContent = v + '%';
  applyVolume(v);
  updateVolumeIcon();
  try { localStorage.setItem('player-volume', String(v)); } catch {}
}
function setBrightness(b){
  b = Math.max(30, Math.min(200, b));
  brightnessSlider.value = String(b);
  brightnessValue.textContent = b + '%';
  const bRange = document.getElementById('vjs-bright-range');
  const bVal = document.getElementById('vjs-bright-val');
  if (bRange) bRange.value = String(b);
  if (bVal) bVal.textContent = b + '%';
  applyBrightness(b);
}
volumeSlider.addEventListener('input', (e) => setVolume(parseInt(e.target.value, 10)));
brightnessSlider.addEventListener('input', (e) => setBrightness(parseInt(e.target.value, 10)));

document.addEventListener('click', () => {

/* ---------------- AUDIO DROPDOWN ---------------- */
function buildContentOptionsHTML(){
  const curLabel = currentType === 'dub' ? 'Dubbed' : 'Subbed';
  const otherType = currentType === 'dub' ? 'sub' : 'dub';
  const otherLabel = otherType === 'dub' ? 'Dubbed' : 'Subbed';
  return `<optgroup label="Content"><option value="content:${currentType}" selected>${esc(curLabel)} (current)</option><option value="content:${otherType}">${esc(otherLabel)}</option></optgroup>`;
}
function buildAudioTrackOptionsHTML(){
  const tracks = (hls && Array.isArray(hls.audioTracks)) ? hls.audioTracks : [];
  if (tracks.length > 0){
    const currentIdx = typeof hls.audioTrack === 'number' ? hls.audioTrack : 0;
    let html = `<optgroup label="Audio Track">`;
    tracks.forEach((t, i) => {
      const name = t.name || t.lang || `Track ${i + 1}`;
      const label = t.lang && t.name && t.name !== t.lang ? `${name} · ${t.lang}` : name;
      html += `<option value="track:${i}"${i === currentIdx ? ' selected' : ''}>${esc(label)}</option>`;
    });
    html += `</optgroup>`;
    return { html, count: tracks.length };
  }
  if (video.src || video.currentSrc) return { html: `<optgroup label="Audio Track"><option value="track:0" selected>Original</option></optgroup>`, count: 1 };
  return { html: '', count: 0 };
}
function updateAudioTracks(){
  const select = document.getElementById('audio-select');
  const countEl = document.getElementById('audio-count');
  if (!select) return;
  const trackPart = buildAudioTrackOptionsHTML();
  select.innerHTML = buildContentOptionsHTML() + trackPart.html;
  select.disabled = false;
  if (countEl){
    if (trackPart.count > 0){ countEl.textContent = String(trackPart.count); countEl.classList.remove('empty'); }
    else { countEl.textContent = '—'; countEl.classList.add('empty'); }
  }
  syncMirrorSelects();
}
document.getElementById('audio-select').addEventListener('change', (e) => {
  const val = e.target.value || '';
  if (val.startsWith('content:')){
    const newType = val.slice('content:'.length);
    if (newType === currentType) return;
    currentType = newType;
    clearExtractCache(anilistId, currentEp, currentType);
    try { history.replaceState(null, '', `?id=${anilistId}&ep=${currentEp}&type=${currentType}`); } catch {}
    addLog('WARN', `content → ${currentType} (re-extracting)`);
    renderEpisodes();
    scrollToVideo();
    play(true, { deep: false });
    return;
  }
  if (val.startsWith('track:')){
    const idx = parseInt(val.slice('track:'.length), 10);
    if (hls && hls.audioTracks && hls.audioTracks[idx]){
      hls.audioTrack = idx;
      addLog('INFO', `audio → ${hls.audioTracks[idx].name || hls.audioTracks[idx].lang || idx}`);
    }
  }
});

  currentCaptionTrack = -1;
  currentSubs = [];
  subtitleCues = [];

function updateCaptionTracks(){
  const select = document.getElementById('caption-select');
  const countEl = document.getElementById('caption-count');
  if (!select) return;
  const subs = currentSubs || [];
  if (!subs.length){
    select.innerHTML = '<option value="-1">Off</option>';
    select.value = '-1';
    select.disabled = true;
    if (countEl){ countEl.textContent = '0'; countEl.classList.add('empty'); }
    syncMirrorSelects();
    return;
  }
  select.innerHTML = '<option value="-1">Off</option>' + subs.map((s, i) => {
    const label = s.label || s.srclang || `Track ${i + 1}`;
    const lang = s.srclang && s.label && s.label !== s.srclang ? ` · ${s.srclang}` : '';
    return `<option value="${i}"${i === currentCaptionTrack ? ' selected' : ''}>${esc(label + lang)}</option>`;
  }).join('');
  select.disabled = false;
  if (countEl){ countEl.textContent = String(subs.length); countEl.classList.remove('empty'); }
  syncMirrorSelects();
}
async function applyCaptionTrack(idx){
  currentCaptionTrack = idx;
  subtitleCues = [];
  updateSubtitleOverlay();
  [...video.querySelectorAll('track')].forEach(t => t.remove());
  updateCCButtonState();
  if (idx === -1){ addLog('INFO', 'captions off'); return; }
  const s = currentSubs[idx];
  if (!s){ addLog('WARN', `caption ${idx} missing`); return; }
  addLog('INFO', `captions → ${s.label || s.srclang || idx}`);
  try {
    const url = proxySeg(s.url, currentSubsReferer);
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const vtt = await r.text();
    subtitleCues = parseVTT(vtt);
    addLog('OK', `captions loaded: ${subtitleCues.length} cues`);
    applyCaptionSettings();
    updateSubtitleOverlay();
  } catch(e){ addLog('WARN', `captions fetch failed: ${e.message}`); }
}
document.getElementById('caption-select').addEventListener('change', (e) => {
  applyCaptionTrack(parseInt(e.target.value, 10));
});
function updateCCButtonState(){
  const ccBtn = document.getElementById('vjs-cc-btn');
  if (ccBtn) ccBtn.classList.toggle('active', currentCaptionTrack !== -1);
}

/* ---------------- QUALITY ---------------- */
function populateQualityDropdown(){
  const sel = document.getElementById('quality-select');
  const countEl = document.getElementById('quality-count');
  if (!sel) return;
  const levels = (hls && Array.isArray(hls.levels)) ? hls.levels : [];
  if (!levels.length){
    sel.innerHTML = '<option value="-1">Auto</option>';
    sel.value = '-1'; sel.disabled = true;
    if (countEl){ countEl.textContent = '—'; countEl.classList.add('empty'); }
    syncMirrorSelects();
    return;
  }
  const byHeight = new Map();
  levels.forEach((l, i) => {
    const h = l.height || 0;
    if (h <= 0) return;
    const existing = byHeight.get(h);
    if (!existing || (existing.bitrate < (l.bitrate || 0))) byHeight.set(h, { i, h, bitrate: l.bitrate || 0 });
  });
  const sorted = [...byHeight.values()].sort((a, b) => b.h - a.h);
  if (!sorted.length){
    sel.innerHTML = '<option value="-1">Auto</option>';
    sel.value = '-1'; sel.disabled = true;
    if (countEl){ countEl.textContent = '—'; countEl.classList.add('empty'); }
    syncMirrorSelects();
    return;
  }
  const current = hls.autoLevelEnabled ? -1 : hls.currentLevel;
  let html = `<option value="-1"${current === -1 ? ' selected' : ''}>Auto</option>`;
  sorted.forEach(lv => { html += `<option value="${lv.i}"${lv.i === current ? ' selected' : ''}>${lv.h}p</option>`; });
  sel.innerHTML = html;
  sel.disabled = false;
  if (countEl){ countEl.textContent = String(sorted.length + 1); countEl.classList.remove('empty'); }
  syncMirrorSelects();
}
document.getElementById('quality-select').addEventListener('change', (e) => {
  if (!hls) return;
  const v = parseInt(e.target.value, 10);
  if (v === -1){ hls.currentLevel = -1; hls.nextLevel = -1; addLog('INFO', 'quality → auto'); }
  else { hls.currentLevel = v; addLog('INFO', `quality → ${hls.levels[v]?.height || '?'}p`); }
});

/* ---------------- CACHES ---------------- */
function getCachedExtract(id, ep, type){
  try { const raw = sessionStorage.getItem(extractKey(id, ep, type)); if (!raw) return null;
    const { data, ts } = JSON.parse(raw); if (Date.now() - ts > EXTRACT_TTL_MS) return null; return data;
  } catch { return null; }
}
function cacheExtract(id, ep, type, data){ try { sessionStorage.setItem(extractKey(id, ep, type), JSON.stringify({ data, ts: Date.now() })); } catch {} }
function clearExtractCache(id, ep, type){ try { sessionStorage.removeItem(extractKey(id, ep, type)); } catch {} }
function getSticky(id, ep, type){
  try { const raw = localStorage.getItem(stickyKey(id, ep, type)); if (!raw) return null;
    const { url, referer, ts } = JSON.parse(raw); if (Date.now() - ts > STICKY_TTL_MS) return null; return { url, referer, ts };
  } catch { return null; }
}
function saveSticky(id, ep, type, url, referer){ try { localStorage.setItem(stickyKey(id, ep, type), JSON.stringify({ url, referer, ts: Date.now() })); addLog('INFO', `sticky saved ep=${ep}`); } catch {} }
function clearSticky(id, ep, type){ try { localStorage.removeItem(stickyKey(id, ep, type)); } catch {} }

/* ---------------- EXTRACT ---------------- */
async function tryProvider(ep, type, provider, nc){
  addLog('INFO', `prov: ${provider}${nc ? ' [fresh]' : ''}`);
  try {
    const data = await fetchJSON(`/anime/extract/${anilistId}?e=${ep}&type=${type}&provider=${provider}${nc}`, EXTRACT_TIMEOUT_MS, `extract:${provider}`);
    const stream = (data.streams || []).find(s => s.isActive !== false);
    if (!stream){ addLog('WARN', `${provider}: empty streams`); return null; }
    if (isEmbedStream(stream)){ addLog('WARN', `${provider}: embed only`); return null; }
    if (!isHlsStream(stream) && !isMp4Stream(stream)){ addLog('WARN', `${provider}: unknown "${stream.type}"`); return null; }
    addLog('OK', `✓ ${provider} → ${stream.type || 'hls'}`);
    return data;
  } catch(e){ addLog('WARN', `${provider} failed: ${e.message}`); return null; }
}
async function fullRace(ep, type, { deep = false, nocache = false } = {}){
  const nc = nocache ? '&nocache=1' : '';
  const d = deep ? '&deep=1' : '';
  const raceMs = deep ? DEEP_RACE_TIMEOUT_MS : FULL_RACE_TIMEOUT_MS;
  const label = deep ? `Deep race (${raceMs/1000}s)` : `Full race (${raceMs/1000}s)`;
  showOverlay('', false, label);
  setStatus('Racing providers', 'loading');
  addLog('INFO', `${deep ? 'DEEP' : 'FULL'} race ep=${ep}`);
  return await fetchJSON(`/anime/extract/${anilistId}?e=${ep}&type=${type}${nc}${d}`, raceMs + 5000, deep ? 'deep-race' : 'race');
}
async function extractFast(ep, type, { silent = false, nocache = false, deep = false } = {}){
  const cached = !nocache && getCachedExtract(anilistId, ep, type);
  if (cached){ addLog('INFO', `extract ep=${ep} [cache hit]`); return cached; }
  if (silent) return null;
  const nc = nocache ? '&nocache=1' : '';
  const provider = currentProvider;
  addLog('INFO', `using server: ${provider}`);
  const data = await tryProvider(ep, type, provider, nc);
  if (data){ cacheExtract(anilistId, ep, type, data); return data; }
  if (provider !== DEFAULT_PROVIDER) throw new Error(`Server "${provider}" has no playable stream.`);
  addLog('WARN', `${provider} empty — full race`);
  const raceData = await fullRace(ep, type, { deep, nocache });
  if (!raceData.streams?.length) throw new Error('No streams from any provider');
  cacheExtract(anilistId, ep, type, raceData);
  addLog('OK', `race won by ${raceData.provider}`);
  return raceData;
}
function proxyM3U8(url, referer){ let p = `/p/m3u8?url=${encodeURIComponent(url)}`; if (referer) p += `&referer=${encodeURIComponent(referer)}`; return p; }
function proxySeg(url, referer){ let p = `/p/seg?url=${encodeURIComponent(url)}`; if (referer) p += `&referer=${encodeURIComponent(referer)}`; return p; }

/* ---------------- EPISODES DATA ---------------- */
function getCachedEpisodes(id){
  try { const raw = sessionStorage.getItem(epsKey(id)); if (!raw) return null;
    const { data, ts } = JSON.parse(raw); if (Date.now() - ts > EPS_TTL_MS) return null; return data;
  } catch { return null; }
}
function cacheEpisodes(id, data){ try { sessionStorage.setItem(epsKey(id), JSON.stringify({ data, ts: Date.now() })); } catch {} }
function episodesFor(type){
  if (episodes?.providers){
    for (const key of Object.keys(episodes.providers)){
      const list = episodes.providers[key]?.episodes?.[type];
      if (list?.length) return list;
    }
  }
  if (fakeEpisodes) return fakeEpisodes;
  return [];
}
function renderEpisodes(){
  const list = episodesFor(currentType);
  if (!list.length){
    epList.innerHTML = `<span class="hint">No ${currentType} episodes from any provider.</span>`;

  scrollActiveIntoEpList(false);
  epSource.textContent = episodes ? '' : 'estimated';
  updateNavButtons();
}
function pickFallbackEp(type){
  const list = episodesFor(type);
  if (!list.length) return null;
  return list.some(e => e.number===currentEp) ? currentEp : list[0].number;
}
async function loadEpisodesBackground(){

function clearStartupTimer(){ if (startupTimer){ clearTimeout(startupTimer); startupTimer = null; } }

/* ---------------- OVERLAY ---------------- */
function showOverlay(msg, err=false, timerPrefix=null){
  overlay.innerHTML = '';
  overlay.classList.toggle('err', err);
  overlay.classList.remove('hidden');
  if (timerPrefix){
    const spinner = document.createElement('div'); spinner.className = 'spinner'; overlay.appendChild(spinner);
    const start = Date.now();
    const text = document.createElement('div');
    text.textContent = `${timerPrefix}… 0s`;
    text.style.cssText = 'margin-top:6px;font-size:13px;color:var(--muted);font-weight:500';
    overlay.appendChild(text);
    if (overlayTimer) clearInterval(overlayTimer);
    overlayTimer = setInterval(() => { text.textContent = `${timerPrefix}… ${Math.round((Date.now()-start)/1000)}s`; }, 1000);
  } else {
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    if (msg){ const text = document.createElement('div'); text.textContent = msg; overlay.appendChild(text); }
  }
}
function hideOverlay(){ if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; } overlay.classList.add('hidden'); overlay.innerHTML = ''; }

async function fetchJSON(url, ms = 30000, tag = ''){
  const t0 = performance.now();
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    const dt = Math.round(performance.now() - t0);
    let body = null;
    try { body = await r.json(); } catch {}
    if (!r.ok){ addLog('WARN', `${tag} ${r.status} ${dt}ms`); const e = new Error(`HTTP ${r.status}`); e.status = r.status; e.body = body; e.timeout = !!body?.timeout; throw e; }
    addLog('INFO', `${tag} 200 ${dt}ms`);
    return body;
  } catch(e){
    if (e.name === 'AbortError'){ addLog('ERROR', `${tag} TIMEOUT ${ms}ms`); const ne = new Error(`Timed out after ${ms/1000}s`); ne.timeout = true; ne.status = 0; throw ne; }
    throw e;
  } finally { clearTimeout(t); }
}

const isMp4Stream   = s => s?.type === 'mp4' || /\.mp4(\?|$)/i.test(s?.url || '');
const isEmbedStream = s => s?.type === 'embed';
const isHlsStream   = s => !s?.type || s.type === 'hls' || /\.m3u8(\?|$)/i.test(s?.url || '');

/* ---------------- PLAY ---------------- */
function playFromData(data){
  const active = (data.streams || []).filter(s => s.isActive !== false);
  const stream = active.find(isHlsStream) || active.find(isMp4Stream) || active[0] || (data.streams && data.streams[0]);
  if (!stream){ showProviderError('any', 'No streams in response'); return; }
  const subs = stream.subtitles || data.subtitles || [];
  const provider = data.provider || currentProvider;
  addLog('INFO', `stream: ${provider} ${stream.type || 'hls'} subs=${subs.length}`);
  if (isEmbedStream(stream)){ showProviderError(provider, 'returned embed, not playable'); return; }
  setMetaBadge('meta-provider', provider);
  setMetaBadge('meta-quality', stream.type === 'mp4' ? 'MP4' : 'HLS');
  if (isHlsStream(stream)){
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    showOverlay('Connecting…');
    setStatus('Loading HLS', 'loading');
    loadHls(proxyM3U8(stream.url, stream.referer), subs, stream.referer, provider, stream.url);
  } else if (isMp4Stream(stream)){
    showOverlay('Connecting (MP4)…', false);
    setStatus('Loading MP4', 'loading');
    loadMp4(stream, subs, provider);
  } else { showProviderError(provider, `unsupported type "${stream.type}"`); }
  history.replaceState(null, '', `?id=${anilistId}&ep=${currentEp}&type=${currentType}`);
}
async function play(nocache = false, { deep = false } = {}){
  if (busy) return;
  busy = true;
  resetTrackControls();
  const sticky = !nocache && getSticky(anilistId, currentEp, currentType);
  const stickyFresh = sticky && (Date.now() - (sticky.ts || 0) < STICKY_FRESH_MS);
  renderEpisodes();
  addLog('INFO', `play ep=${currentEp} type=${currentType} nocache=${nocache} deep=${deep}`);
  if (STREAM_URL_OVERRIDE){
    addLog('INFO', 'override URL active');
    setMetaBadge('meta-provider', 'override');
    showOverlay('Connecting to override…');
    setStatus('Override', 'loading');
    loadHls(proxyM3U8(STREAM_URL_OVERRIDE, STREAM_REF_OVERRIDE), [], STREAM_REF_OVERRIDE, 'override', STREAM_URL_OVERRIDE);
    busy = false;
    return;
  }
  if (stickyFresh){
    addLog('INFO', 'sticky fresh, playing immediately');
    setStatus('From cache', 'loading');
    setMetaBadge('meta-provider', 'sticky');
    showOverlay('Connecting from cache…');
    const kind = /\.mp4(\?|$)/i.test(sticky.url) ? 'mp4' : 'hls';
    setMetaBadge('meta-quality', kind.toUpperCase());
    if (kind === 'mp4') loadMp4({ url: sticky.url, referer: sticky.referer }, [], 'sticky');
    else loadHls(proxyM3U8(sticky.url, sticky.referer), [], sticky.referer, 'sticky', sticky.url);
    busy = false;
    return;
  }
  setStatus('Extracting', 'loading');
  const cached = !nocache && getCachedExtract(anilistId, currentEp, currentType);
  showOverlay(cached ? 'Loading stream…' : '', false, cached ? null : 'Extracting stream');
  try {
    const data = await extractFast(currentEp, currentType, { nocache, deep });
    if (!data) throw new Error('No stream');
    playFromData(data);
  } catch(e){
    addLog('WARN', `extract failed: ${e.message}`);
    if (sticky){
      addLog('WARN', 'using stale sticky URL as fallback');
      showOverlay('Trying cached URL…');
      const sk = /\.mp4(\?|$)/i.test(sticky.url) ? 'mp4' : 'hls';
      setMetaBadge('meta-provider', 'sticky');
      setMetaBadge('meta-quality', sk.toUpperCase());
      if (sk === 'mp4') loadMp4({ url: sticky.url, referer: sticky.referer }, [], 'sticky');
      else loadHls(proxyM3U8(sticky.url, sticky.referer), [], sticky.referer, 'sticky', sticky.url);
    } else {
      addLog('ERROR', `play failed: ${e.message}`);
      showProviderError(currentProvider, e.message);
    }
  } finally { busy = false; }
}

/* ---------------- ERROR ---------------- */
function showProviderError(provider, reason){
  if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
  clearStartupTimer();
  setStatus('Failed', 'error');
  overlay.classList.add('err');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;padding:0 20px;text-align:center">
      <div style="font-size:15px;font-weight:700">Stream failed · <span style="color:var(--accent2,#a78bfa)">${esc(provider)}</span></div>
      <div style="font-size:12px;opacity:.75;line-height:1.55">${esc(reason || 'Manifest did not load')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px">
        <button id="overlay-retry" class="btn-accent" style="padding:10px 20px;max-width:140px">Retry</button>
        <button id="overlay-next" class="btn-ghost" style="padding:10px 18px;max-width:130px">Next server</button>
        <button id="overlay-back" class="btn-ghost" style="padding:10px 18px;max-width:100px">Back</button>
      </div>
    </div>`;
  const retryBtn = document.getElementById('overlay-retry');
  if (retryBtn) retryBtn.addEventListener('click', () => { clearExtractCache(anilistId, currentEp, currentType); hideOverlay(); addLog('WARN', `retry extraction (${currentType})`); play(true, { deep: false }); });
  const nextBtn = document.getElementById('overlay-next');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const idx = PROVIDER_LIST.indexOf(currentProvider);
    const next = PROVIDER_LIST[(idx + 1) % PROVIDER_LIST.length];
    currentProvider = next;
    try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
    const sel = document.getElementById('provider-select'); if (sel) sel.value = currentProvider;
    clearExtractCache(anilistId, currentEp, currentType);
    play(true, { deep: false });
  });
  const backBtn = document.getElementById('overlay-back');
  if (backBtn) backBtn.addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = './index.html'; });
}
video.addEventListener('error', () => {
  if (!video.error) return;
  const codes = { 1: 'Aborted', 2: 'Network error', 3: 'Decode error', 4: 'Format not supported' };
  const msg = codes[video.error.code] || `Error ${video.error.code}`;
  addLog('ERROR', `video.error: ${msg}`);
  if (video.readyState === 0) showProviderError(currentProvider, msg);
});

/* ---------------- MP4 ---------------- */
function loadMp4(stream, subs, provider){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  attachSubtitles(subs, stream.referer);
  video.src = proxySeg(stream.url, stream.referer);
  video.load();
  startupTimer = setTimeout(() => {
    if (video.readyState < 2){
      if (provider === 'sticky'){ addLog('WARN', 'sticky MP4 timeout, extracting'); clearSticky(anilistId, currentEp, currentType); hideOverlay(); play(true, { deep: false }); return; }
      showProviderError(provider, 'MP4 source did not start');
    }
  }, 15000);
  const onPlaying = () => {
    clearStartupTimer(); hideOverlay(); setStatus('Playing', 'playing');
    saveSticky(anilistId, currentEp, currentType, stream.url, stream.referer);
    updateAudioTracks();
    video.removeEventListener('playing', onPlaying);
  };
  video.addEventListener('playing', onPlaying);
  video.play().catch(()=>{});
}

/* ---------------- HLS ---------------- */
function loadHls(src, subs, referer, provider, rawUrl){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  attachSubtitles(subs, referer);
  if (window.Hls && Hls.isSupported()){
    hls = new Hls({
      enableWorker: true, lowLatencyMode: false, debug: false,
      startLevel: 0, testBandwidth: false, startFragPrefetch: true,
      abrEwmaDefaultEstimate: 500000, abrBandWidthFactor: 0.95, abrBandWidthUpFactor: 0.75,
      maxBufferLength: 30, maxMaxBufferLength: 60, maxBufferSize: 60*1000*1000, maxBufferHole: 0.5, backBufferLength: 30,
      manifestLoadingTimeOut: 12000, manifestLoadingMaxRetry: 3, manifestLoadingRetryDelay: 500, manifestLoadingMaxRetryTimeout: 64000,
      levelLoadingTimeOut: 20000, levelLoadingMaxRetry: 6, levelLoadingRetryDelay: 500, levelLoadingMaxRetryTimeout: 64000,
      fragLoadingTimeOut: 45000, fragLoadingMaxRetry: 15, fragLoadingRetryDelay: 800, fragLoadingMaxRetryTimeout: 120000,
      appendErrorMaxRetry: 5, maxStarvationDelay: 4, maxLoadingDelay: 4,
      enableWebVTT: true, enableIMSC1: false, enableCEA708Captions: false,
    });
    hls.loadSource(src); hls.attachMedia(video);
    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => { addLog('INFO', `audio tracks: ${hls.audioTracks?.length || 0}`); updateAudioTracks(); });
    hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, () => updateAudioTracks());
    startupTimer = setTimeout(() => {
      if (video.readyState < 2){
        addLog('ERROR', `startup timeout ${STARTUP_TIMEOUT_MS/1000}s`);
        if (provider === 'sticky'){ addLog('WARN', 'sticky startup timeout, extracting'); clearSticky(anilistId, currentEp, currentType); if (hls){ try { hls.destroy(); } catch(_){} hls = null; } hideOverlay(); play(true, { deep: false }); return; }
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);
    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => {
      addLog('OK', `HLS manifest: ${d.levels?.length ?? '?'} levels`);
      const heights = (hls.levels || []).map(l => l.height).filter(h => h > 0);
      if (heights.length){ const maxH = Math.max(...heights); if (maxH) setMetaBadge('meta-quality', `${maxH}p`); }
      updateAudioTracks(); populateQualityDropdown();
      showOverlay('Buffering…');
      video.play().catch(()=>{});
    });
    hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => { const h = hls.levels?.[d.level]?.height; if (h) setMetaBadge('meta-quality', `${h}p`); });
    const onPlaying = () => { clearStartupTimer(); hideOverlay(); setStatus('Playing', 'playing'); if (rawUrl) saveSticky(anilistId, currentEp, currentType, rawUrl, referer); try { sessionStorage.removeItem(`adv:${anilistId}:${currentEp}:${currentType}`); } catch {} video.removeEventListener('playing', onPlaying); };
    video.addEventListener('playing', onPlaying);
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      addLog('ERROR', `HLS fatal: ${d.type} / ${d.details}`);
      clearStartupTimer();
      if (provider === 'sticky'){ addLog('WARN', 'sticky failed, extracting'); clearSticky(anilistId, currentEp, currentType); if (hls){ try { hls.destroy(); } catch(_){} hls = null; } hideOverlay(); play(true, { deep: false }); return; }
      if (/manifest/i.test(d.details || '')){
        if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
        clearSticky(anilistId, currentEp, currentType);
        const attemptKey = `adv:${anilistId}:${currentEp}:${currentType}`;
        let attempts = 0; try { attempts = parseInt(sessionStorage.getItem(attemptKey) || '0', 10); } catch {}
        if (attempts < PROVIDER_LIST.length - 1){
          try { sessionStorage.setItem(attemptKey, String(attempts + 1)); } catch {}
          const curIdx = PROVIDER_LIST.indexOf(currentProvider);
          const nextIdx = curIdx >= 0 ? (curIdx + 1) % PROVIDER_LIST.length : 0;
          const next = PROVIDER_LIST[nextIdx];
          addLog('WARN', `manifest failed on ${provider} (requested ${currentProvider}), trying ${next}`);
          currentProvider = next;
          try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
          const sel = document.getElementById('provider-select'); if (sel) sel.value = currentProvider;
          clearExtractCache(anilistId, currentEp, currentType);
          hideOverlay();
          play(true, { deep: false });
          return;
        }
        try { sessionStorage.removeItem(attemptKey); } catch {}
        showProviderError(provider, `Manifest did not load (${d.details})`);
        return;
      }
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR){ showOverlay('Network error, retrying…', true); try { hls.startLoad(); } catch(_) {} return; }
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR){
        showOverlay('Media error, recovering…', true);
        try { hls.recoverMediaError(); } catch(_){ try { hls.swapAudioCodec(); hls.recoverMediaError(); } catch(_){ showProviderError(provider, `Playback failed: ${d.details}`); } }
        return;
      }
      showProviderError(provider, `Playback failed: ${d.details}`);
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    addLog('INFO', 'using native HLS');
    video.src = src;
    startupTimer = setTimeout(() => {
      if (video.readyState < 2){
        if (provider === 'sticky'){ addLog('WARN', 'sticky native timeout, extracting'); clearSticky(anilistId, currentEp, currentType); hideOverlay(); play(true, { deep: false }); return; }
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);
    const onPlaying = () => { clearStartupTimer(); hideOverlay(); setStatus('Playing', 'playing'); if (rawUrl) saveSticky(anilistId, currentEp, currentType, rawUrl, referer); try { sessionStorage.removeItem(`adv:${anilistId}:${currentEp}:${currentType}`); } catch {} updateAudioTracks(); video.removeEventListener('playing', onPlaying); };
    video.addEventListener('playing', onPlaying);
    video.play().catch(()=>{});
  } else {
    showProviderError(provider, 'HLS not supported in this browser');
  }
}

async function loadMeta(){
  try {
    const info = await fetchJSON(`/anime/info/${anilistId}`, 30000, 'info');
    const title = (typeof info.title === 'object' && info.title) ? (info.title.english || info.title.romaji || info.title.native || info.title.userPreferred) : null;
    const t = title || info.title || `Anime #${anilistId}`;
    $('#title').textContent = t; $('#header-title').textContent = t; document.title = t + ' · Player';
    const coverUrl = info.coverImage?.extraLarge || info.coverImage?.large || info.coverImage?.medium || info.bannerImage || PLACEHOLDER;
    const coverEl = $('#cover');
    coverEl.classList.add('loading');
    coverEl.onerror = () => { coverEl.src = PLACEHOLDER; coverEl.classList.remove('loading'); coverEl.classList.add('placeholder'); };
    coverEl.onload = () => { coverEl.classList.remove('loading'); };
    coverEl.src = coverUrl;
    const poster = info.bannerImage || info.coverImage?.extraLarge || info.coverImage?.large || PLACEHOLDER;
    video.poster = poster;
    const bits = [];
    if (info.format) bits.push(info.format);
    if (info.seasonYear) bits.push(String(info.seasonYear));
    if (info.episodes) bits.push(`${info.episodes} ep`);
    if (info.averageScore) bits.push(`${info.averageScore}%`);
    $('#subtitle').textContent = bits.join(' · ');
    if (info.episodes > 0 && !episodes){
      fakeEpisodes = Array.from({ length: info.episodes }, (_, i) => ({ number: i + 1 }));
      renderEpisodes();
    }
  } catch(e){
    addLog('WARN', `meta failed: ${e.message}`);
    const fallback = `Anime #${anilistId}`;
    $('#title').textContent = fallback; $('#header-title').textContent = fallback; $('#cover').src = PLACEHOLDER;
  }
}

function updateNavButtons(){
  const prev = document.getElementById('vjs-prev');
  const next = document.getElementById('vjs-next');
  if (!prev || !next) return;
  const list = episodesFor(currentType);
  if (!list.length){ prev.disabled = true; next.disabled = true; return; }
  const idx = list.findIndex(e => e.number === currentEp);
  prev.disabled = idx <= 0;
  next.disabled = idx === -1 || idx >= list.length - 1;
}

function goToEpisode(delta){
  const list = episodesFor(currentType);
  if (!list.length) return;
  const idx = list.findIndex(e => e.number === currentEp);
  let target;
  if (idx === -1) target = delta > 0 ? 0 : list.length - 1;
  else target = Math.max(0, Math.min(list.length - 1, idx + delta));
  if (list[target].number === currentEp) return;
  currentEp = list[target].number;
  addLog('INFO', `episode → ${currentEp}`);
  renderEpisodes();
  scrollToVideo();
  play();
}

function fmtTime(s){
  if (!isFinite(s) || s < 0) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function initCustomControls(){

  // ---- Progress bar ----
  const wrap = document.getElementById('vjs-progress-wrap');
  const played = document.getElementById('vjs-progress-played');
  const buffered = document.getElementById('vjs-progress-buffered');
  const thumb = document.getElementById('vjs-progress-thumb');
  const timeEl = document.getElementById('vjs-time');

  let seeking = false;
  function seekFromX(clientX){
    if (!isFinite(video.duration) || !video.duration) return;
    const rect = wrap.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    video.currentTime = pct * video.duration;
  }
  wrap.addEventListener('pointerdown', (e) => {
    if (!isFinite(video.duration) || !video.duration) return;
    seeking = true;
    wrap.classList.add('dragging');
    wrap.setPointerCapture(e.pointerId);
    seekFromX(e.clientX);
  });
  wrap.addEventListener('pointermove', (e) => { if (seeking) seekFromX(e.clientX); });
  const stopSeek = (e) => { seeking = false; wrap.classList.remove('dragging'); try { wrap.releasePointerCapture(e.pointerId); } catch {} };
  wrap.addEventListener('pointerup', stopSeek);
  wrap.addEventListener('pointercancel', () => { seeking = false; wrap.classList.remove('dragging'); });

  video.addEventListener('timeupdate', () => {
    timeEl.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
    if (!isFinite(video.duration) || !video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    played.style.width = pct + '%';
    thumb.style.left = pct + '%';
  });
  video.addEventListener('durationchange', () => {
    timeEl.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
  });
  video.addEventListener('progress', () => {
    if (!video.buffered.length || !video.duration) return;
    let end = 0;
    for (let i = 0; i < video.buffered.length; i++){
      if (video.buffered.start(i) <= video.currentTime && video.currentTime <= video.buffered.end(i)){
        end = video.buffered.end(i); break;
      }
    }
    if (!end && video.buffered.length) end = video.buffered.end(video.buffered.length - 1);
    buffered.style.width = ((end / video.duration) * 100) + '%';
  });

  // ---- Play / Pause ----
  document.getElementById('vjs-play').addEventListener('click', () => {
    if (!video.src && !video.currentSrc) return;
    if (video.paused) video.play().catch(()=>{});
    else video.pause();
  });
  video.addEventListener('play', () => { setPlayIcon(); showControls(); });
  video.addEventListener('pause', () => { setPlayIcon(); showControls(); });

  // ---- Skip 10s ----
  document.getElementById('vjs-rew').addEventListener('click', () => {
    if (!isFinite(video.duration)) return;
    video.currentTime = Math.max(0, video.currentTime - 10);
  });
  document.getElementById('vjs-fwd').addEventListener('click', () => {
    if (!isFinite(video.duration)) return;
    video.currentTime = Math.min(video.duration, video.currentTime + 10);
  });

  // ---- Prev / Next episode ----
  document.getElementById('vjs-prev').addEventListener('click', () => goToEpisode(-1));
  document.getElementById('vjs-next').addEventListener('click', () => goToEpisode(1));

  // ---- Autoplay next ----
  const autoChk = document.getElementById('vjs-autoplay');
  if (autoChk){
    autoChk.checked = autoplayNext;
    autoChk.addEventListener('change', () => {
      autoplayNext = autoChk.checked;
      try { localStorage.setItem('player-autoplay-next', autoplayNext ? '1' : '0'); } catch {}
      addLog('INFO', `autoplay next: ${autoplayNext}`);
    });
  }
  video.addEventListener('ended', () => {
    updateNavButtons();
    if (!autoplayNext) return;
    const list = episodesFor(currentType);
    const idx = list.findIndex(e => e.number === currentEp);
    if (idx === -1 || idx >= list.length - 1){ addLog('INFO', 'autoplay: no next episode'); return; }
    addLog('INFO', `autoplay → ep ${list[idx + 1].number}`);
    goToEpisode(1);
  });

  // ---- Volume popup ----
  const volRange = document.getElementById('vjs-vol-range');
  volRange.value = volumeSlider.value;
  document.getElementById('vjs-vol-val').textContent = volumeSlider.value + '%';
  volRange.addEventListener('input', (e) => setVolume(parseInt(e.target.value, 10)));

  // ---- Brightness popup ----
  const brightRange = document.getElementById('vjs-bright-range');
  brightRange.value = brightnessSlider.value;
  document.getElementById('vjs-bright-val').textContent = brightnessSlider.value + '%';
  brightRange.addEventListener('input', (e) => setBrightness(parseInt(e.target.value, 10)));

  // ---- CC select / style shortcut ----
  document.getElementById('vjs-cc-select').addEventListener('change', (e) => {
    const main = document.getElementById('caption-select');
    if (!main) return;
    main.value = e.target.value;
    main.dispatchEvent(new Event('change'));
  });
  document.getElementById('vjs-cc-style').addEventListener('click', () => {
    // close popups, open the sidebar caption settings
    document.querySelectorAll('.vjs-pop.open').forEach(p => p.classList.remove('open'));
    const toggle = document.getElementById('cc-settings-toggle');
    const panel = document.getElementById('caption-settings');
    if (panel && panel.hidden && toggle) toggle.click();
    const card = document.getElementById('cc-section');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // ---- Audio select ----
  document.getElementById('vjs-audio-select').addEventListener('change', (e) => {
    const main = document.getElementById('audio-select');
    if (!main) return;
    main.value = e.target.value;
    main.dispatchEvent(new Event('change'));
  });

  // ---- Quality select ----
  document.getElementById('vjs-quality-select').addEventListener('change', (e) => {
    const main = document.getElementById('quality-select');
    if (!main) return;
    main.value = e.target.value;
    main.dispatchEvent(new Event('change'));
  });

  // ---- Fullscreen ----
  document.getElementById('vjs-fs-btn').addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (box.requestFullscreen){
      box.requestFullscreen().catch(()=>{});
    } else if (box.webkitRequestFullscreen){
      box.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen){
      video.webkitEnterFullscreen();
    }
  });

  // ---- Popup open/close ----
  document.querySelectorAll('.vjs-pop-wrap').forEach(wrap => {
    const btn = wrap.querySelector('.vjs-btn');
    const pop = wrap.querySelector('.vjs-pop');
    if (!btn || !pop) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = pop.classList.contains('open');
      document.querySelectorAll('.vjs-pop.open').forEach(p => p.classList.remove('open'));
      if (!wasOpen) pop.classList.add('open');
      showControls();
    });
    pop.addEventListener('click', (e) => e.stopPropagation());
  });
  document.addEventListener('click', () => {
    const hadOpen = document.querySelectorAll('.vjs-pop.open').length > 0;
    document.querySelectorAll('.vjs-pop.open').forEach(p => p.classList.remove('open'));
    if (hadOpen) showControls();
  });

  // ---- Auto show/hide ----
  box.addEventListener('mousemove', showControls);
  box.addEventListener('touchstart', showControls, { passive: true });
  video.addEventListener('click', () => {
    if (!video.src && !video.currentSrc) return;
    if (video.paused) video.play().catch(()=>{});
    else video.pause();
    showControls();
  });

  // ---- Initial state ----
  setPlayIcon();
  updateVolumeIcon();
  updateNavButtons();
  // Mirror initial state
  document.getElementById('vjs-vol-range').value = volumeSlider.value;
  document.getElementById('vjs-vol-val').textContent = volumeSlider.value + '%';
  document.getElementById('vjs-bright-range').value = brightnessSlider.value;
  document.getElementById('vjs-bright-val').textContent = brightnessSlider.value + '%';
  syncMirrorSelects();
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  if (!anilistId){ showOverlay('Missing ?id= in URL', true); return; }
  window.scrollTo(0, 0);
  addLog('INFO', `anilistId=${anilistId} ep=${startEp} type=${startType} provider=${currentProvider}`);
  if (STREAM_URL_OVERRIDE) addLog('INFO', 'STREAM_URL_OVERRIDE active');

  initCustomControls();   // NEW

  updateAudioTracks();
  loadMeta();
  loadEpisodesBackground();
  play();
  setTimeout(() => window.scrollTo(0, 0), 100);
})();
</script>
</body>
