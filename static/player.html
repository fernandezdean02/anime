<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./hls.min.js"></script>
</head>
<body>
  <header>
    <a class="back" href="./index.html">← Back</a>
    <span class="brand" id="header-title">Player</span>
  </header>

  <div class="player-wrap">
    <div>
      <div class="video-box">
        <video id="video" controls playsinline preload="auto" crossorigin="anonymous"></video>
        <div class="overlay" id="overlay">Loading…</div>
      </div>
      <div class="meta">
        <img id="cover" alt="">
        <div>
          <h2 id="title">Loading…</h2>
          <p id="subtitle"></p>
        </div>
      </div>
    </div>

    <aside class="side">
      <div>
        <h3>Audio</h3>
        <div class="audio-toggle" id="audio-toggle">
          <button data-type="sub" class="active">Sub</button>
          <button data-type="dub">Dub</button>
        </div>
      </div>

      <div>
        <h3>Server</h3>
        <select id="provider-select" class="provider-select"></select>
      </div>

      <div id="vlc-section">
        <h3>External Player</h3>
        <input type="url" id="vlc-url-input" class="vlc-url-input"
               placeholder="Stream URL (auto-fills or paste manually)" autocomplete="off" spellcheck="false">
        <div class="vlc-mode" id="vlc-mode">
          <label><input type="radio" name="vlc-mode" value="raw" checked> <span>Raw CDN</span></label>
          <label><input type="radio" name="vlc-mode" value="proxy"> <span>Proxied</span></label>
        </div>
        <div class="vlc-row">
          <button id="vlc-copy" class="vlc-btn">Copy link</button>
          <button id="vlc-open" class="vlc-btn">Open in VLC</button>
        </div>
        <div id="vlc-hint" class="hint" style="margin-top:6px">No stream yet</div>
      </div>

      <div id="cc-section" hidden>
        <h3>Subtitles</h3>
        <select id="cc-select" class="cc-select">
          <option value="-1">Off</option>
        </select>
      </div>

      <div style="flex:1;min-height:0;display:flex;flex-direction:column">
        <h3>Episodes <span id="ep-source" style="text-transform:none;font-size:10px;color:var(--muted)"></span></h3>
        <div class="ep-list" id="ep-list"><span class="hint">Loading…</span></div>
      </div>
      <button class="retry" id="retry">Retry</button>
      <div class="hint">Server remembered per session. URL override bypasses extract.</div>
    </aside>
  </div>

  <button id="log-toggle" title="Dev log">📋</button>
  <div id="log-panel">
    <div id="log-header">
      <strong>Dev Log</strong>
      <span id="log-count" style="opacity:.6;font-size:11px"></span>
      <span style="flex:1"></span>
      <button id="log-copy">Copy</button>
      <button id="log-clear">Clear</button>
      <button id="log-close">✕</button>
    </div>
    <pre id="log-content"></pre>
  </div>

<style>
#log-toggle{position:fixed;bottom:16px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#log-toggle:hover{background:var(--accent2)}
#log-panel{display:none;position:fixed;bottom:76px;right:16px;z-index:9999;width:min(560px,calc(100vw - 32px));max-height:60vh;background:#0d0d12;border:1px solid var(--border);border-radius:12px;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#log-panel.open{display:flex}
#log-header{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
#log-header button{padding:4px 10px;background:var(--elev);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px}
#log-header button:hover{border-color:var(--accent)}
#log-content{flex:1;overflow:auto;padding:10px 12px;font:11px/1.5 ui-monospace,Monaco,Consolas,monospace;color:#c8c8d0;white-space:pre-wrap;word-break:break-all;margin:0;max-height:calc(60vh - 44px)}
.cc-select, .provider-select{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;outline:none;font-weight:600}
.cc-select:focus, .provider-select:focus{border-color:var(--accent)}
.overlay button{pointer-events:auto !important;cursor:pointer}
.vlc-url-input{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;font-family:ui-monospace,Monaco,Consolas,monospace;margin-bottom:8px;outline:none;box-sizing:border-box}
.vlc-url-input:focus{border-color:var(--accent)}
.vlc-url-input::placeholder{color:var(--muted)}
.vlc-mode{display:flex;gap:14px;margin-bottom:8px;font-size:12px}
.vlc-mode label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.vlc-mode input{accent-color:var(--accent);cursor:pointer}
.vlc-row{display:flex;gap:8px}
.vlc-btn{flex:1;padding:10px 8px;background:var(--elev);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.vlc-btn:hover:not(:disabled){border-color:var(--accent)}
.vlc-btn:disabled{opacity:.5;cursor:not-allowed}
</style>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const anilistId = Number(params.get('id'));
const startEp   = Number(params.get('ep') || 1);
const startType = params.get('type') === 'dub' ? 'dub' : 'sub';
const STREAM_URL_OVERRIDE = params.get('streamUrl');
const STREAM_REF_OVERRIDE = params.get('streamReferer') || '';

const video    = $('#video');
const overlay  = $('#overlay');
const epList   = $('#ep-list');
const epSource = $('#ep-source');

// ---------------- DEV LOG ----------------
const logLines = [];
const MAX_LOG = 800;
function fmt(v){
  if (v instanceof Error) return v.message;
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v); } catch { return String(v); }
}
function addLog(level, ...args){
  const ts = new Date().toTimeString().slice(0, 8);
  const line = `[${ts}] ${level.padEnd(5)} ${args.map(fmt).join(' ')}`;
  logLines.push(line);
  if (logLines.length > MAX_LOG) logLines.shift();
  const el = document.getElementById('log-content');
  if (el){ el.textContent = logLines.join('\n'); el.scrollTop = el.scrollHeight; }
  const cnt = document.getElementById('log-count');
  if (cnt) cnt.textContent = `(${logLines.length})`;
}
['log','info','warn','error','debug'].forEach(level => {
  const orig = console[level].bind(console);
  console[level] = (...a) => {
    orig(...a);
    addLog(level === 'log' ? 'INFO' : level.toUpperCase(), ...a);
  };
});
window.addEventListener('error', e => addLog('ERROR', 'uncaught:', e.message));
window.addEventListener('unhandledrejection', e =>
  addLog('ERROR', 'unhandled:', e.reason?.message || e.reason));

$('#log-toggle').addEventListener('click', () => $('#log-panel').classList.toggle('open'));
$('#log-close').addEventListener('click', () => $('#log-panel').classList.remove('open'));
$('#log-clear').addEventListener('click', () => {
  logLines.length = 0;
  document.getElementById('log-content').textContent = '';
  document.getElementById('log-count').textContent = '(0)';
  addLog('INFO', 'log cleared');
});
$('#log-copy').addEventListener('click', async () => {
  const text = logLines.join('\n');
  if (!text) return;
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(text);
    else throw 0;
    $('#log-copy').textContent = 'Copied!';
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
    $('#log-copy').textContent = 'Copied!';
  }
  setTimeout(() => $('#log-copy').textContent = 'Copy', 1200);
});
// ---------------- END DEV LOG ----------------

// ---------------- PROVIDER SELECTION ----------------
const ALL_PROVIDERS = ['kaa', 'anizone', 'aniwaves', 'anineko',
                       'animeonsen', 'anikoto', 'mkissa', 'animegg'];
const PROVIDER_LIST = [...new Set(ALL_PROVIDERS)];
const DEFAULT_PROVIDER = 'anizone';
const PROVIDER_STORAGE_KEY = 'provider-pref';

let currentProvider = DEFAULT_PROVIDER;
const urlProvider = params.get('provider');
if (urlProvider){
  currentProvider = urlProvider;
  try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
} else {
  try {
    const saved = sessionStorage.getItem(PROVIDER_STORAGE_KEY);
    if (saved) currentProvider = saved;
  } catch {}
}

function populateProviderSelect(){
  const sel = document.getElementById('provider-select');
  if (!sel) return;
  const list = PROVIDER_LIST.includes(currentProvider)
    ? PROVIDER_LIST
    : [currentProvider, ...PROVIDER_LIST];
  sel.innerHTML = list.map(p =>
    `<option value="${p}"${p === currentProvider ? ' selected' : ''}>${p}</option>`
  ).join('');
  sel.value = currentProvider;
}
populateProviderSelect();

document.getElementById('provider-select').addEventListener('change', (e) => {
  const newProvider = e.target.value;
  if (newProvider === currentProvider) return;
  currentProvider = newProvider;
  try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
  clearExtractCache(anilistId, currentEp, currentType);
  addLog('WARN', `server → ${currentProvider} (re-extracting)`);
  play(true, { deep: false });
});
// ---------------- END PROVIDER SELECTION ----------------

const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='112' height='160'>
     <rect width='100%' height='100%' fill='#1e1e28'/>
   </svg>`);

const EXTRACT_TIMEOUT_MS    = 105000;
const FULL_RACE_TIMEOUT_MS  = 105000;
const DEEP_RACE_TIMEOUT_MS  = 200000;
const STARTUP_TIMEOUT_MS    = 45000;

const EPS_TTL_MS = 2 * 60 * 60 * 1000;
const EXTRACT_TTL_MS = 5 * 60 * 1000;
const STICKY_TTL_MS = 6 * 60 * 60 * 1000;

const epsKey       = id => `eps:${id}`;
const extractKey   = (id, ep, type) => `x:${id}:${ep}:${type}`;
const stickyKey    = (id, ep, type) => `sticky:${id}:${ep}:${type}`;

let hls = null;
let startupTimer = null;
let episodes = null;
let fakeEpisodes = null;
let currentType = startType;
let currentEp = startEp;
let busy = false;
let overlayTimer = null;
let currentSubs = [];
let currentSubsReferer = null;

// SINGLE source of truth for the VLC section
let currentStream = { url: '', referer: '', kind: 'hls', provider: '' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function showOverlay(msg, err=false, timerPrefix=null){
  overlay.innerHTML = '';
  overlay.classList.toggle('err', err);
  overlay.classList.remove('hidden');

  if (timerPrefix){
    const start = Date.now();
    const text = document.createElement('div');
    text.textContent = `${timerPrefix}… 0s`;
    overlay.appendChild(text);
    if (overlayTimer) clearInterval(overlayTimer);
    overlayTimer = setInterval(() => {
      text.textContent = `${timerPrefix}… ${Math.round((Date.now()-start)/1000)}s`;
    }, 1000);
  } else {
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    if (msg){
      const text = document.createElement('div');
      text.textContent = msg;
      overlay.appendChild(text);
    }
  }

  // Inline "Open in VLC" shortcut when a URL is ready — lets user
  // skip browser buffering entirely, especially for slow mp4.
  if (!err && currentStream && currentStream.url){
    const btn = document.createElement('button');
    btn.textContent = '▶ Open in VLC (faster)';
    btn.style.cssText =
      'margin-top:16px;padding:12px 28px;background:var(--accent);color:#fff;' +
      'border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;' +
      'box-shadow:0 4px 12px rgba(0,0,0,.4)';
    btn.addEventListener('click', (e) => { e.stopPropagation(); openInVlc(); });
    overlay.appendChild(btn);
  }
}
function hideOverlay(){
  if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
  overlay.classList.add('hidden');
  overlay.innerHTML = '';
}

async function fetchJSON(url, ms = 30000, tag = ''){
  const t0 = performance.now();
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    const dt = Math.round(performance.now() - t0);
    let body = null;
    try { body = await r.json(); } catch {}
    if (!r.ok){
      addLog('WARN', `${tag} ${r.status} ${dt}ms`);
      const e = new Error(`HTTP ${r.status}`);
      e.status = r.status; e.body = body;
      e.timeout = !!body?.timeout;
      throw e;
    }
    addLog('INFO', `${tag} 200 ${dt}ms`);
    return body;
  } catch(e){
    if (e.name === 'AbortError'){
      addLog('ERROR', `${tag} TIMEOUT ${ms}ms`);
      const ne = new Error(`Timed out after ${ms/1000}s`);
      ne.timeout = true; ne.status = 0;
      throw ne;
    }
    throw e;
  } finally { clearTimeout(t); }
}

const isMp4Stream   = s => s?.type === 'mp4' || /\.mp4(\?|$)/i.test(s?.url || '');
const isEmbedStream = s => s?.type === 'embed';
const isHlsStream   = s => !s?.type || s.type === 'hls' || /\.m3u8(\?|$)/i.test(s?.url || '');

// ---------------- VLC INTEGRATION ----------------
function vlcUrlInputEl(){ return document.getElementById('vlc-url-input'); }

function vlcMode(){
  const el = document.querySelector('input[name="vlc-mode"]:checked');
  return el ? el.value : 'raw';
}
function vlcRawUrl(){
  return currentStream.url || null;
}
function vlcProxyUrl(){
  if (!currentStream.url) return null;
  const u = encodeURIComponent(currentStream.url);
  const r = currentStream.referer ? `&referer=${encodeURIComponent(currentStream.referer)}` : '';
  if (currentStream.kind === 'mp4') return `${location.origin}/p/seg?url=${u}${r}`;
  return `${location.origin}/p/m3u8?url=${u}${r}&abs=1`;
}
function vlcUrl(){
  return vlcMode() === 'proxy' ? vlcProxyUrl() : vlcRawUrl();
}

function updateVlcHint(){
  const hint = document.getElementById('vlc-hint');
  if (!hint) return;
  if (!currentStream.url){
    hint.textContent = 'No stream yet — extracting or paste URL manually';
    return;
  }
  const mode = vlcMode();
  const parts = [mode === 'proxy' ? 'Proxied' : 'Raw',
                 String(currentStream.kind || 'hls').toUpperCase()];
  if (currentStream.provider) parts.push(currentStream.provider);
  hint.textContent = parts.join(' · ');
}

function setVlcStream(url, referer, kind, provider){
  currentStream = {
    url: url || '',
    referer: referer || '',
    kind: kind || 'hls',
    provider: provider || '',
  };
  const inp = vlcUrlInputEl();
  if (inp) inp.value = currentStream.url;
  updateVlcHint();
}

function clearVlcStream(){
  currentStream = { url: '', referer: '', kind: 'hls', provider: '' };
  const inp = vlcUrlInputEl();
  if (inp) inp.value = '';
  updateVlcHint();
}

(function bindVlcInput(){
  const inp = vlcUrlInputEl();
  if (!inp) return;
  inp.addEventListener('input', e => {
    const v = e.target.value.trim();
    currentStream.url = v;
    if (/\.mp4(\?|$)/i.test(v)) currentStream.kind = 'mp4';
    else if (/\.m3u8(\?|$)/i.test(v)) currentStream.kind = 'hls';
    updateVlcHint();
  });
})();

async function copyVlcLink(){
  const link = vlcUrl();
  if (!link){ addLog('WARN', 'no VLC link available'); return; }
  const btn = document.getElementById('vlc-copy');
  try {
    await navigator.clipboard.writeText(link);
    addLog('OK', `copied [${vlcMode()}] ${link.length} chars`);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy link', 1400);
  } catch(e){
    addLog('WARN', `clipboard failed: ${e.message} — showing prompt`);
    window.prompt('Copy this URL and paste in VLC → New stream:', link);
  }
}

async function openInVlc(){
  if (!currentStream.url){
    addLog('WARN', 'no URL — extract in progress or paste manually');
    window.alert('No stream URL yet. Wait for extract, or paste a URL into the field above.');
    return;
  }
  const mode = vlcMode();
  const btn = document.getElementById('vlc-open');
  const orig = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Opening…'; }
  try {
    const u = encodeURIComponent(currentStream.url);
    const r = currentStream.referer ? `&referer=${encodeURIComponent(currentStream.referer)}` : '';
    const resp = await fetch(`/open?url=${u}${r}&kind=${currentStream.kind}&mode=${mode}`);
    if (!resp.ok){
      const txt = await resp.text().catch(() => '');
      addLog('ERROR', `VLC launch failed [${mode}]: HTTP ${resp.status} ${txt.slice(0, 200)}`);
      window.alert(`VLC launch failed (${resp.status}).\n\n${txt.slice(0, 400)}`);
      return;
    }
    const j = await resp.json().catch(() => ({}));
    addLog('OK', `VLC open [${mode}] → ${(j.target || '').slice(0, 100)}`);
  } catch(e){
    addLog('ERROR', `VLC launch error: ${e.message}`);
    window.alert('VLC launch error: ' + e.message);
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = orig || 'Open in VLC'; }
  }
}

document.getElementById('vlc-copy').addEventListener('click', copyVlcLink);
document.getElementById('vlc-open').addEventListener('click', openInVlc);
document.getElementById('vlc-mode').addEventListener('change', updateVlcHint);
// ---------------- END VLC INTEGRATION ----------------

function getCachedExtract(id, ep, type){
  try {
    const raw = sessionStorage.getItem(extractKey(id, ep, type));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > EXTRACT_TTL_MS) return null;
    return data;
  } catch { return null; }
}
function cacheExtract(id, ep, type, data){
  try { sessionStorage.setItem(extractKey(id, ep, type),
    JSON.stringify({ data, ts: Date.now() })); } catch {}
}
function clearExtractCache(id, ep, type){
  try { sessionStorage.removeItem(extractKey(id, ep, type)); } catch {}
}

function getSticky(id, ep, type){
  try {
    const raw = localStorage.getItem(stickyKey(id, ep, type));
    if (!raw) return null;
    const { url, referer, ts } = JSON.parse(raw);
    if (Date.now() - ts > STICKY_TTL_MS) return null;
    return { url, referer };
  } catch { return null; }
}
function saveSticky(id, ep, type, url, referer){
  try {
    localStorage.setItem(stickyKey(id, ep, type),
      JSON.stringify({ url, referer, ts: Date.now() }));
    addLog('INFO', `sticky saved for ep=${ep} (${type})`);
  } catch {}
}
function clearSticky(id, ep, type){
  try { localStorage.removeItem(stickyKey(id, ep, type)); } catch {}
}

async function tryProvider(ep, type, provider, nc){
  addLog('INFO', `prov: ${provider}${nc ? ' [fresh]' : ''}`);
  try {
    const data = await fetchJSON(
      `/anime/extract/${anilistId}?e=${ep}&type=${type}&provider=${provider}${nc}`,
      EXTRACT_TIMEOUT_MS,
      `extract:${provider}`
    );
    const stream = (data.streams || []).find(s => s.isActive !== false);
    if (!stream){ addLog('WARN', `${provider}: empty streams`); return null; }
    if (isEmbedStream(stream)){ addLog('WARN', `${provider}: embed only (unplayable)`); return null; }
    if (!isHlsStream(stream) && !isMp4Stream(stream)){
      addLog('WARN', `${provider}: unknown type "${stream.type}"`); return null;
    }
    addLog('OK', `✓ ${provider} → ${stream.type || 'hls'}`);
    return data;
  } catch(e){
    addLog('WARN', `${provider} failed: ${e.message}`);
    return null;
  }
}

async function fullRace(ep, type, { deep = false, nocache = false } = {}){
  const nc = nocache ? '&nocache=1' : '';
  const d = deep ? '&deep=1' : '';
  const raceMs = deep ? DEEP_RACE_TIMEOUT_MS : FULL_RACE_TIMEOUT_MS;
  const label = deep
    ? `Deep race (up to ${raceMs/1000}s)`
    : `Full race (up to ${raceMs/1000}s)`;
  showOverlay('', false, label);
  addLog('INFO', `${deep ? 'DEEP' : 'FULL'} race ep=${ep}`);
  return await fetchJSON(
    `/anime/extract/${anilistId}?e=${ep}&type=${type}${nc}${d}`,
    raceMs + 5000,
    deep ? 'deep-race' : 'race'
  );
}

async function extractFast(ep, type, { silent = false, nocache = false, deep = false } = {}){
  const cached = !nocache && getCachedExtract(anilistId, ep, type);
  if (cached){
    addLog('INFO', `extract ep=${ep} [cache hit] provider=${cached.provider}`);
    return cached;
  }
  if (silent) return null;

  const nc = nocache ? '&nocache=1' : '';
  const provider = currentProvider;

  addLog('INFO', `using server: ${provider}`);
  const data = await tryProvider(ep, type, provider, nc);
  if (data){
    cacheExtract(anilistId, ep, type, data);
    return data;
  }
  if (provider !== DEFAULT_PROVIDER){
    throw new Error(`Server "${provider}" has no playable stream. Pick another server.`);
  }
  addLog('WARN', `${provider} empty — full race`);
  const raceData = await fullRace(ep, type, { deep, nocache });
  if (!raceData.streams?.length) throw new Error('No streams from any provider');
  cacheExtract(anilistId, ep, type, raceData);
  addLog('OK', `race won by ${raceData.provider}`);
  return raceData;
}

function proxyM3U8(url, referer){
  let p = `/p/m3u8?url=${encodeURIComponent(url)}`;
  if (referer) p += `&referer=${encodeURIComponent(referer)}`;
  return p;
}
function proxySeg(url, referer){
  let p = `/p/seg?url=${encodeURIComponent(url)}`;
  if (referer) p += `&referer=${encodeURIComponent(referer)}`;
  return p;
}

function getCachedEpisodes(id){
  try {
    const raw = sessionStorage.getItem(epsKey(id));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > EPS_TTL_MS) return null;
    return data;
  } catch { return null; }
}
function cacheEpisodes(id, data){
  try { sessionStorage.setItem(epsKey(id), JSON.stringify({ data, ts: Date.now() })); } catch {}
}

function episodesFor(type){
  if (episodes?.providers){
    for (const key of Object.keys(episodes.providers)){
      const list = episodes.providers[key]?.episodes?.[type];
      if (list?.length) return list;
    }
  }
  if (fakeEpisodes) return fakeEpisodes;
  return [];
}

function renderEpisodes(){
  const list = episodesFor(currentType);
  if (!list.length){
    epList.innerHTML = `<span class="hint">No ${currentType} episodes available.</span>`;
    return;
  }
  epList.innerHTML = list.map(e =>
    `<button data-ep="${e.number}" class="${e.number===currentEp?'active':''}">${e.number}</button>`
  ).join('');
  const active = epList.querySelector('button.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
  epSource.textContent = episodes ? '' : '(estimated)';
}

function pickFallbackEp(type){
  const list = episodesFor(type);
  if (!list.length) return null;
  return list.some(e => e.number===currentEp) ? currentEp : list[0].number;
}

async function loadEpisodesBackground(){
  const cached = getCachedEpisodes(anilistId);
  if (cached){
    episodes = cached;
    const fb = pickFallbackEp(currentType);
    if (fb && !params.get('ep')) currentEp = fb;
    renderEpisodes();
    addLog('INFO', 'episodes from cache');
    return;
  }
  addLog('INFO', 'loading episodes…');
  try {
    const data = await fetchJSON(`/anime/episodes/${anilistId}`, 130000, 'episodes');
    episodes = data;
    cacheEpisodes(anilistId, data);
    const fb = pickFallbackEp(currentType);
    if (fb && !params.get('ep')) currentEp = fb;
    renderEpisodes();
    addLog('OK', 'episodes list loaded');
  } catch(e){
    addLog('ERROR', `episodes failed: ${e.message}`);
  }
}

function attachSubtitles(subs, referer){
  [...video.querySelectorAll('track')].forEach(t => t.remove());
  currentSubs = subs || [];
  currentSubsReferer = referer;

  const section = document.getElementById('cc-section');
  const select  = document.getElementById('cc-select');

  if (!currentSubs.length){
    section.hidden = true;
    select.innerHTML = '<option value="-1">Off</option>';
    return;
  }
  section.hidden = false;
  select.innerHTML = '<option value="-1">Off</option>' +
    currentSubs.map((s, i) =>
      `<option value="${i}">${esc(s.label || 'Track ' + (i+1))}</option>`
    ).join('');
  select.value = '-1';
  addLog('INFO', `CC: ${currentSubs.length} tracks (lazy)`);
}

document.getElementById('cc-select').addEventListener('change', async (e) => {
  const idx = parseInt(e.target.value, 10);
  [...video.querySelectorAll('track')].forEach(t => t.remove());
  if (idx === -1){ addLog('INFO', 'CC: off'); return; }
  const s = currentSubs[idx];
  if (!s){ addLog('WARN', `CC: track ${idx} missing`); return; }
  addLog('INFO', `CC: loading "${s.label}"`);
  const t = document.createElement('track');
  t.kind = 'subtitles';
  t.label = s.label || `Track ${idx+1}`;
  t.srclang = s.srclang || 'en';
  t.src = proxySeg(s.url, currentSubsReferer);
  t.default = true;
  video.appendChild(t);
  setTimeout(() => {
    const tracks = video.textTracks;
    for (let i = 0; i < tracks.length; i++) tracks[i].mode = 'showing';
  }, 200);
});

function clearStartupTimer(){
  if (startupTimer){ clearTimeout(startupTimer); startupTimer = null; }
}

function playFromData(data){
  // Prefer HLS over MP4 — m3u8 is a tiny text fetch, mp4 has to buffer bytes.
  const active = (data.streams || []).filter(s => s.isActive !== false);
  const stream = active.find(isHlsStream)
              || active.find(isMp4Stream)
              || active[0]
              || (data.streams && data.streams[0]);
  if (!stream){ showProviderError('any', 'No streams in response'); return; }

  const subs = stream.subtitles || data.subtitles || [];
  const provider = data.provider || currentProvider;
  addLog('INFO', `stream: provider=${provider} type=${stream.type || 'hls'} subs=${subs.length}`);

  if (isEmbedStream(stream)){
    showProviderError(provider, 'returned embed (iframe), not playable');
    return;
  }

  if (isHlsStream(stream)){
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    // Populate VLC section FIRST — overlay shortcut uses it
    setVlcStream(stream.url, stream.referer, 'hls', provider);
    showOverlay('Connecting…');
    loadHls(proxyM3U8(stream.url, stream.referer), subs, stream.referer, provider, stream.url);
  } else if (isMp4Stream(stream)){
    setVlcStream(stream.url, stream.referer, 'mp4', provider);
    showOverlay('Connecting (MP4)…', false);
    loadMp4(stream, subs, provider);
  } else {
    showProviderError(provider, `unsupported type "${stream.type}"`);
  }
  history.replaceState(null, '', `?id=${anilistId}&ep=${currentEp}&type=${currentType}`);
}

async function play(nocache = false, { deep = false } = {}){
  if (busy) return;
  busy = true;

  // Prepopulate VLC from sticky cache BEFORE extraction runs.
  const sticky = getSticky(anilistId, currentEp, currentType);
  if (sticky){
    const kind = /\.mp4(\?|$)/i.test(sticky.url) ? 'mp4' : 'hls';
    setVlcStream(sticky.url, sticky.referer, kind, 'sticky');
    addLog('INFO', 'VLC prepopulated from sticky cache');
  } else {
    clearVlcStream();
  }

  renderEpisodes();
  addLog('INFO', `play ep=${currentEp} type=${currentType} nocache=${nocache} deep=${deep}`);

  if (STREAM_URL_OVERRIDE){
    addLog('INFO', `using URL override (bypass extract)`);
    const subs = [];
    const overrideKind = /\.mp4(\?|$)/i.test(STREAM_URL_OVERRIDE) ? 'mp4' : 'hls';
    setVlcStream(STREAM_URL_OVERRIDE, STREAM_REF_OVERRIDE, overrideKind, 'override');
    showOverlay('Connecting to override URL…');
    loadHls(proxyM3U8(STREAM_URL_OVERRIDE, STREAM_REF_OVERRIDE), subs, STREAM_REF_OVERRIDE, 'override', STREAM_URL_OVERRIDE);
    busy = false;
    return;
  }

  const cached = !nocache && getCachedExtract(anilistId, currentEp, currentType);
  showOverlay(cached ? 'Loading stream…' : '', false, cached ? null : 'Extracting stream');

  try {
    const data = await extractFast(currentEp, currentType, { nocache, deep });
    if (!data) throw new Error('No stream');
    playFromData(data);
  } catch(e){
    addLog('WARN', `extract failed: ${e.message}`);
    if (sticky){
      addLog('WARN', `using sticky URL (already in VLC field)`);
      showOverlay('Trying cached URL…');
      loadHls(proxyM3U8(sticky.url, sticky.referer), [], sticky.referer, 'sticky', sticky.url);
    } else {
      addLog('ERROR', `play failed: ${e.message}`);
      showProviderError(currentProvider,
        e.message + ' — or paste a URL into the External Player field');
    }
  } finally { busy = false; }
}

function showProviderError(provider, reason){
  if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
  clearStartupTimer();

  overlay.classList.add('err');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;padding:0 20px">
      <div style="font-size:15px;font-weight:600">Stream from <b>${esc(provider)}</b> failed.</div>
      <div style="font-size:12px;opacity:.75;line-height:1.5">${esc(reason || 'Manifest did not load')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px">
        ${currentStream && currentStream.url
          ? '<button id="overlay-vlc" style="padding:10px 22px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:700">▶ Play in VLC</button>'
          : ''}
        <button id="overlay-reload" style="padding:10px 22px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600">Reload</button>
        <button id="overlay-next" style="padding:10px 22px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600">Next server</button>
        <button id="overlay-back" style="padding:10px 22px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600">Back</button>
      </div>
    </div>`;

  const vlcBtn = document.getElementById('overlay-vlc');
  if (vlcBtn) vlcBtn.addEventListener('click', (e) => { e.stopPropagation(); openInVlc(); });

  const reloadBtn = document.getElementById('overlay-reload');
  if (reloadBtn) reloadBtn.addEventListener('click', () => location.reload());

  const nextBtn = document.getElementById('overlay-next');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const idx = PROVIDER_LIST.indexOf(currentProvider);
    const next = PROVIDER_LIST[(idx + 1) % PROVIDER_LIST.length];
    currentProvider = next;
    try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
    const sel = document.getElementById('provider-select');
    if (sel) sel.value = currentProvider;
    clearExtractCache(anilistId, currentEp, currentType);
    addLog('WARN', `switched to ${currentProvider}, retrying`);
    play(true, { deep: false });
  });

  const backBtn = document.getElementById('overlay-back');
  if (backBtn) backBtn.addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = './index.html';
  });
}

function loadMp4(stream, subs, provider){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  video.dataset.triedBackup = '';
  attachSubtitles(subs, stream.referer);
  video.src = proxySeg(stream.url, stream.referer);
  video.load();

  startupTimer = setTimeout(() => {
    if (video.readyState < 2){
      showProviderError(provider, 'MP4 source did not start');
    }
  }, 8000);

  const onPlaying = () => {
    clearStartupTimer(); hideOverlay();
    saveSticky(anilistId, currentEp, currentType, stream.url, stream.referer);
    video.removeEventListener('playing', onPlaying);
  };
  video.addEventListener('playing', onPlaying);

  video.addEventListener('error', () => {
    clearStartupTimer();
    const code = video.error?.code;
    showProviderError(provider, `MP4 failed (code ${code})`);
  }, { once:true });

  video.play().catch(()=>{});
}

function loadHls(src, subs, referer, provider, rawUrl){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  attachSubtitles(subs, referer);

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      startLevel: 0,
      testBandwidth: false,
      startFragPrefetch: true,
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      maxBufferSize: 40 * 1000 * 1000,
      maxBufferHole: 0.5,
      abrEwmaDefaultEstimate: 2000000,
      abrBandWidthFactor: 0.85,
      abrBandWidthUpFactor: 0.7,
      abrMaxWithRealBitrate: true,
      capLevelToPlayerSize: true,
      maxAutoLevel: 2,
      manifestLoadingTimeOut: 25000,
      manifestLoadingMaxRetry: 2,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 80000,
      levelLoadingMaxRetry: 3,
      levelLoadingRetryDelay: 600,
      levelLoadingMaxRetryTimeout: 10000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 800,
      fragLoadingMaxRetryTimeout: 64000,
      appendErrorMaxRetry: 3,
      maxStarvationDelay: 4,
      maxLoadingDelay: 4,
      backBufferLength: 30,
    });
    hls.loadSource(src);
    hls.attachMedia(video);

    startupTimer = setTimeout(() => {
      if (video.readyState < 2){
        addLog('ERROR', `startup timeout ${STARTUP_TIMEOUT_MS/1000}s`);
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);

    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => {
      addLog('OK', `HLS manifest parsed (${d.levels?.length ?? '?'} levels)`);
      if (hls.levels && hls.levels.length){
        const cap = hls.levels
          .map((l, i) => ({ h: l.height || 0, i }))
          .filter(x => x.h > 0 && x.h <= 720)
          .pop();
        if (cap && cap.i < hls.levels.length - 1){
          hls.autoLevelCapping = cap.i;
        }
      }
      showOverlay('Buffering…');
      video.play().catch(()=>{});
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => {
      addLog('INFO', `HLS level → ${hls.levels[d.level]?.height || '?'}p`);
    });

    const onPlaying = () => {
      clearStartupTimer(); hideOverlay();
      if (rawUrl){
        saveSticky(anilistId, currentEp, currentType, rawUrl, referer);
      }
      video.removeEventListener('playing', onPlaying);
    };
    video.addEventListener('playing', onPlaying);

    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      addLog('ERROR', `HLS ${d.type} ${d.details}`);
      clearStartupTimer();

      if (/manifest/i.test(d.details || '')){
        if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
        clearSticky(anilistId, currentEp, currentType);
        addLog('WARN', `manifest failed on ${provider} — clearing sticky cache`);
        showProviderError(provider, `Manifest did not load (${d.details})`);
        return;
      }
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR){
        showOverlay('Network error, retrying…', true);
        hls.startLoad();
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR){
        showOverlay('Media error, recovering…', true);
        hls.recoverMediaError();
      } else {
        showProviderError(provider, `Playback failed: ${d.details}`);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    addLog('INFO', 'using native HLS');
    video.src = src;
    startupTimer = setTimeout(() => {
      if (video.readyState < 2){
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);
    const onPlaying = () => {
      clearStartupTimer(); hideOverlay();
      if (rawUrl){
        saveSticky(anilistId, currentEp, currentType, rawUrl, referer);
      }
      video.removeEventListener('playing', onPlaying);
    };
    video.addEventListener('playing', onPlaying);
    video.addEventListener('error', () => {
      clearStartupTimer();
      showProviderError(provider, 'Native HLS failed');
    });
    video.play().catch(()=>{});
  } else {
    showProviderError(provider, 'HLS not supported in this browser');
  }
}

async function loadMeta(){
  try {
    const info = await fetchJSON(`/anime/info/${anilistId}`, 30000, 'info');
    const t = info.title?.english || info.title?.romaji || 'Unknown';
    $('#title').textContent = t;
    $('#header-title').textContent = t;
    document.title = t + ' · Player';
    const img = info.coverImage?.large || info.coverImage?.extraLarge || PLACEHOLDER;
    $('#cover').src = img;
    $('#cover').onerror = () => { $('#cover').src = PLACEHOLDER; };
    $('#subtitle').textContent = [
      info.format, info.seasonYear, info.episodes ? info.episodes+' ep' : null
    ].filter(Boolean).join(' · ');
    if (info.episodes > 0 && !episodes){
      fakeEpisodes = Array.from({ length: info.episodes }, (_, i) => ({ number: i + 1 }));
      renderEpisodes();
    }
  } catch(e){
    addLog('WARN', `meta failed: ${e.message}`);
    $('#title').textContent = 'Anime #' + anilistId;
  }
}

$('#audio-toggle').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-type]');
  if (!b || b.dataset.type === currentType) return;
  currentType = b.dataset.type;
  [...$('#audio-toggle').children].forEach(x => x.classList.toggle('active', x===b));
  const fb = pickFallbackEp(currentType);
  if (fb) currentEp = fb;
  play();
});

epList.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-ep]');
  if (!b) return;
  const n = Number(b.dataset.ep);
  if (n === currentEp) return;
  currentEp = n;
  play();
});

$('#retry').addEventListener('click', () => {
  clearExtractCache(anilistId, currentEp, currentType);
  addLog('WARN', 'manual retry');
  play(true, { deep: false });
});

(async function boot(){
  if (!anilistId){ showOverlay('Missing ?id= in URL', true); return; }
  [...$('#audio-toggle').children].forEach(x =>
    x.classList.toggle('active', x.dataset.type === currentType));
  addLog('INFO', `anilistId=${anilistId} ep=${startEp} type=${startType} provider=${currentProvider}`);
  if (STREAM_URL_OVERRIDE){
    addLog('INFO', `STREAM_URL_OVERRIDE active → bypass extract`);
  }
  loadMeta();
  loadEpisodesBackground();
  play();
})();
</script>
