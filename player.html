<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <title>Player</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./hls.min.js"></script>
</head>
<body>
  <header>
    <a class="back" href="./index.html">← Back</a>
    <span class="brand" id="header-title">Player</span>
  </header>

  <div class="player-wrap">
    <div class="player-main">
      <div class="video-box">
        <video id="video" controls playsinline webkit-playsinline preload="auto"></video>
        <div class="overlay" id="overlay">Loading…</div>
      </div>
      <div class="meta">
        <div class="cover-wrap">
          <img id="cover" alt="" loading="lazy">
        </div>
        <div class="meta-text">
          <h2 id="title">Loading…</h2>
          <p id="subtitle"></p>
          <div class="meta-pills">
            <span class="status-pill" id="status-pill">
              <span class="dot"></span><span id="status-text">Idle</span>
            </span>
            <span class="meta-badge" id="meta-provider">—</span>
            <span class="meta-badge" id="meta-quality">—</span>
          </div>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="card">
        <h3>Audio <span class="badge empty" id="audio-count">—</span></h3>
        <select id="audio-select" class="track-select" disabled>
          <option>No audio yet</option>
        </select>
      </div>

      <div class="card" id="quality-card">
        <h3>Quality <span class="badge empty" id="quality-count">—</span></h3>
        <select id="quality-select" class="track-select" disabled>
          <option value="-1">Auto</option>
        </select>
      </div>

      <div class="card" id="cc-section">
        <h3>Captions <span class="badge empty" id="caption-count">—</span></h3>
        <select id="caption-select" class="track-select" disabled>
          <option value="-1">Off</option>
        </select>
      </div>

      <div class="card">
        <h3>Server</h3>
        <select id="provider-select" class="track-select"></select>
      </div>

      <div class="card">
        <h3>Playback</h3>
        <div class="slider-row">
          <label for="volume-slider">Volume</label>
          <input type="range" id="volume-slider" min="0" max="300" step="5" value="100">
          <span class="slider-value" id="volume-value">100%</span>
        </div>
        <div class="slider-row">
          <label for="brightness-slider">Brightness</label>
          <input type="range" id="brightness-slider" min="30" max="200" step="5" value="100">
          <span class="slider-value" id="brightness-value">100%</span>
        </div>
      </div>

      <div class="card episodes-card" id="episodes-card">
        <h3 class="episodes-header" id="episodes-header" role="button" tabindex="0" aria-expanded="false" aria-controls="ep-list">
          <span class="ep-title">Episodes</span>
          <span id="ep-source" class="ep-source"></span>
          <svg class="ep-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </h3>
        <div class="ep-list" id="ep-list"><span class="hint">Loading episodes…</span></div>
      </div>

      <button class="retry" id="retry">Retry extraction</button>
    </aside>
  </div>

  <button id="log-toggle" title="Dev log">📋</button>
  <div id="log-panel">
    <div id="log-header">
      <strong>Dev Log</strong>
      <span id="log-count" style="opacity:.6;font-size:11px"></span>
      <span style="flex:1"></span>
      <button id="log-copy">Copy</button>
      <button id="log-clear">Clear</button>
      <button id="log-close">✕</button>
    </div>
    <pre id="log-content"></pre>
  </div>

<style>
/* ═══════ DARK SCROLLBARS EVERYWHERE ═══════ */
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(124, 92, 255, 0.35) rgba(255, 255, 255, 0.03);
}
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 4px; }
*::-webkit-scrollbar-thumb {
  background: rgba(124, 92, 255, 0.28);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
*::-webkit-scrollbar-thumb:hover {
  background: rgba(124, 92, 255, 0.5);
  background-clip: padding-box;
}
*::-webkit-scrollbar-corner { background: transparent; }

select, input, textarea, button, option { color-scheme: dark; }

/* ═══════ THEME ═══════ */
:root {
  --glow: rgba(124, 92, 255, 0.35);
  --glass: rgba(24, 24, 34, 0.72);
  --glass-border: rgba(255, 255, 255, 0.06);
}

html, body { margin: 0; }

body {
  background:
    radial-gradient(1200px 600px at 15% -10%, #1a1430 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 100%, #0d1a2e 0%, transparent 55%),
    var(--bg, #0a0a0f);
  background-attachment: fixed;
  color: var(--text, #e0e0e8);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--glass-border);
  background: rgba(8, 8, 12, 0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
}
header .back {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--text);
  text-decoration: none;
  font-size: 13px; font-weight: 600;
  padding: 7px 12px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  transition: all .18s;
}
header .back:hover { border-color: var(--accent, #7c5cff); }
header .brand {
  flex: 1;
  text-align: center;
  font-size: 14px; font-weight: 700;
  background: linear-gradient(135deg, var(--text) 20%, var(--accent, #7c5cff) 130%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.player-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 20px;
  max-width: 1600px;
  margin: 0 auto;
  padding: 20px;
}
@media (max-width: 900px) {
  .player-wrap { grid-template-columns: 1fr; padding: 12px; }
  .side { max-height: none; }
}

.video-box {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.55),
    0 0 100px rgba(124, 92, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.04);
  background: #000;
  aspect-ratio: 16 / 9;
}
.video-box video {
  display: block;
  width: 100%; height: 100%;
  background: #000;
  object-fit: contain;
  transition: filter .15s ease;
}

.meta {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 16px;
  margin-top: 12px;
  border-radius: 14px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
}
.cover-wrap {
  width: 66px; height: 94px;
  border-radius: 10px; overflow: hidden;
  flex-shrink: 0;
  background: linear-gradient(135deg, #1a1a26 0%, #252532 100%);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255,255,255,0.04);
}
.cover-wrap img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: opacity .3s;
}
.cover-wrap img.loading { opacity: 0; }
.cover-wrap img.placeholder { opacity: 0.35; }

.meta-text { min-width: 0; flex: 1; }
.meta-text h2 {
  font-size: 18px;
  margin: 0 0 5px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.meta-text p { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.meta-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.meta-badge {

.status-pill {

.side {

.card {

.card h3 {

.track-select {

}
.track-select:hover:not(:disabled) { background-color: rgba(0, 0, 0, 0.55); }
.track-select:focus { border-color: var(--accent, #7c5cff); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.12); }
.track-select:disabled { opacity: 0.75; cursor: not-allowed; }
.track-select option { background: #14141c; color: var(--text); padding: 8px; }

.slider-row {
  display: grid;
  grid-template-columns: 82px 1fr 48px;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.slider-row:last-child { margin-bottom: 0; }
.slider-row label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.slider-row input[type="range"] {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
  accent-color: var(--accent, #7c5cff);
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent, #7c5cff), var(--accent2, #a78bfa));

.slider-row input[type="range"]::-moz-range-thumb {

</style>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const anilistId = Number(params.get('id'));
const startEp   = Number(params.get('ep') || 1);
const startType = params.get('type') === 'dub' ? 'dub' : 'sub';
const STREAM_URL_OVERRIDE = params.get('streamUrl');
const STREAM_REF_OVERRIDE = params.get('streamReferer') || '';

const video    = $('#video');
const overlay  = $('#overlay');
const epList   = $('#ep-list');
const epSource = $('#ep-source');

// ---------------- DEV LOG ----------------
const logLines = [];
const MAX_LOG = 800;
function fmt(v){
  if (v instanceof Error) return v.message;
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v); } catch { return String(v); }
}
function addLog(level, ...args){
  const ts = new Date().toTimeString().slice(0, 8);
  const line = `[${ts}] ${level.padEnd(5)} ${args.map(fmt).join(' ')}`;
  logLines.push(line);
  if (logLines.length > MAX_LOG) logLines.shift();
  const el = document.getElementById('log-content');
  if (el){ el.textContent = logLines.join('\n'); el.scrollTop = el.scrollHeight; }
  const cnt = document.getElementById('log-count');
  if (cnt) cnt.textContent = `(${logLines.length})`;
}
['log','info','warn','error','debug'].forEach(level => {
  const orig = console[level].bind(console);
  console[level] = (...a) => { orig(...a); addLog(level === 'log' ? 'INFO' : level.toUpperCase(), ...a); };
});
window.addEventListener('error', e => addLog('ERROR', 'uncaught:', e.message));
window.addEventListener('unhandledrejection', e => addLog('ERROR', 'unhandled:', e.reason?.message || e.reason));

// ---------------- AUDIO GRAPH / VOLUME / BRIGHTNESS ----------------
function ensureAudioGraph(){
  if (audioCtx) return true;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    audioCtx = new Ctx();
    audioSourceNode = audioCtx.createMediaElementSource(video);
    audioGainNode = audioCtx.createGain();
    audioGainNode.gain.value = 1.0;
    audioSourceNode.connect(audioGainNode);
    audioGainNode.connect(audioCtx.destination);
    addLog('INFO', 'audio graph created');
    return true;
  } catch(e){
    addLog('WARN', `audio graph failed: ${e.message}`);
    audioCtx = null;
    return false;
  }
}

function applyVolume(pct){
  const clamped = Math.max(0, Math.min(300, pct));
  if (clamped === 0){
    video.muted = true;
    video.volume = 0;
    if (audioGainNode) audioGainNode.gain.value = 0;
    return;
  }
  video.muted = false;

  if (clamped <= 100 && !audioCtx){
    video.volume = clamped / 100;
    return;
  }
  if (!ensureAudioGraph()){
    video.volume = Math.min(1, clamped / 100);
    return;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  video.volume = 1.0;
  audioGainNode.gain.value = clamped / 100;
}

function applyBrightness(pct){
  const b = Math.max(30, Math.min(200, pct));
  video.style.filter = b === 100 ? '' : `brightness(${b/100})`;
  try { localStorage.setItem('player-brightness', String(b)); } catch {}
}

} catch {}

function resetTrackControls(){
  const audioSel = document.getElementById('audio-select');
  const audioCount = document.getElementById('audio-count');
  if (audioSel){ audioSel.innerHTML = '<option>No audio yet</option>'; audioSel.disabled = true; }
  if (audioCount){ audioCount.textContent = '—'; audioCount.classList.add('empty'); }

  const capSel = document.getElementById('caption-select');

  if (capSel){ capSel.innerHTML = '<option value="-1">Off</option>'; capSel.value = '-1'; capSel.disabled = true; }
  if (capCount){ capCount.textContent = '—'; capCount.classList.add('empty'); }

  if (qCount){ qCount.textContent = '—'; qCount.classList.add('empty'); }

  currentCaptionTrack = -1;

function updateAudioTracks(){
  const select = document.getElementById('audio-select');
  const countEl = document.getElementById('audio-count');
  if (!select) return;
  const tracks = (hls && Array.isArray(hls.audioTracks)) ? hls.audioTracks : [];
  if (!tracks.length){
    if (video.src || video.currentSrc){
      select.innerHTML = '<option value="0">Original</option>';
      select.value = '0';
      select.disabled = true;
      if (countEl){ countEl.textContent = '1'; countEl.classList.remove('empty'); }
    } else {
      select.innerHTML = '<option>No audio yet</option>';
      select.disabled = true;
      if (countEl){ countEl.textContent = '—'; countEl.classList.add('empty'); }
    }
    return;
  }
  const currentIdx = typeof hls.audioTrack === 'number' ? hls.audioTrack : 0;
  select.innerHTML = tracks.map((t, i) => {
    const name = t.name || t.lang || `Track ${i + 1}`;
    const label = t.lang && t.name && t.name !== t.lang ? `${name} · ${t.lang}` : name;
    return `<option value="${i}"${i === currentIdx ? ' selected' : ''}>${esc(label)}</option>`;
  }).join('');
  select.disabled = tracks.length <= 1;
  if (countEl){ countEl.textContent = String(tracks.length); countEl.classList.remove('empty'); }
}

document.getElementById('audio-select').addEventListener('change', (e) => {
  const idx = parseInt(e.target.value, 10);
  if (hls && hls.audioTracks && hls.audioTracks[idx]){
    hls.audioTrack = idx;
    addLog('INFO', `audio → ${hls.audioTracks[idx].name || hls.audioTracks[idx].lang}`);
  }
});

function updateCaptionTracks(){
  const select = document.getElementById('caption-select');
  const countEl = document.getElementById('caption-count');
  if (!select) return;
  const subs = currentSubs || [];
  if (!subs.length){
    select.innerHTML = '<option value="-1">Off</option>';
    select.value = '-1';
    select.disabled = true;
    if (countEl){ countEl.textContent = '0'; countEl.classList.add('empty'); }
    return;
  }
  select.innerHTML = '<option value="-1">Off</option>' + subs.map((s, i) => {
    const label = s.label || s.srclang || `Track ${i + 1}`;
    const lang = s.srclang && s.label && s.label !== s.srclang ? ` · ${s.srclang}` : '';
    return `<option value="${i}"${i === currentCaptionTrack ? ' selected' : ''}>${esc(label + lang)}</option>`;
  }).join('');
  select.disabled = false;
  if (countEl){ countEl.textContent = String(subs.length); countEl.classList.remove('empty'); }
}

function applyCaptionTrack(idx){
  [...video.querySelectorAll('track')].forEach(t => t.remove());
  currentCaptionTrack = idx;
  if (idx === -1){ addLog('INFO', 'captions off'); return; }
  const s = currentSubs[idx];
  if (!s){ addLog('WARN', `caption ${idx} missing`); return; }
  addLog('INFO', `captions → ${s.label || s.srclang || idx}`);
  const t = document.createElement('track');
  t.kind = 'subtitles';
  t.label = s.label || `Track ${idx + 1}`;
  t.srclang = s.srclang || 'en';
  t.src = proxySeg(s.url, currentSubsReferer);
  t.default = true;
  video.appendChild(t);
  setTimeout(() => {
    const tracks = video.textTracks;
    for (let i = 0; i < tracks.length; i++) tracks[i].mode = 'showing';
  }, 200);
}

// ---------------- QUALITY ----------------
function populateQualityDropdown(){
  const sel = document.getElementById('quality-select');
  const countEl = document.getElementById('quality-count');
  if (!sel) return;

  const levels = (hls && Array.isArray(hls.levels)) ? hls.levels : [];
  if (!levels.length){
    sel.innerHTML = '<option value="-1">Auto</option>';
    sel.value = '-1';
    sel.disabled = true;
    if (countEl){ countEl.textContent = '—'; countEl.classList.add('empty'); }
    return;
  }

  const byHeight = new Map();
  levels.forEach((l, i) => {
    const h = l.height || 0;
    if (h <= 0) return;
    const existing = byHeight.get(h);
    if (!existing || (existing.bitrate < (l.bitrate || 0))){
      byHeight.set(h, { i, h, bitrate: l.bitrate || 0 });
    }
  });
  const sorted = [...byHeight.values()].sort((a, b) => b.h - a.h);

  if (!sorted.length){
    sel.innerHTML = '<option value="-1">Auto</option>';
    sel.value = '-1';
    sel.disabled = true;
    if (countEl){ countEl.textContent = '—'; countEl.classList.add('empty'); }
    return;
  }

  const current = hls.autoLevelEnabled ? -1 : hls.currentLevel;
  let html = `<option value="-1"${current === -1 ? ' selected' : ''}>Auto</option>`;
  sorted.forEach(lv => {
    html += `<option value="${lv.i}"${lv.i === current ? ' selected' : ''}>${lv.h}p</option>`;
  });
  sel.innerHTML = html;
  sel.disabled = false;
  if (countEl){ countEl.textContent = String(sorted.length + 1); countEl.classList.remove('empty'); }
}

document.getElementById('quality-select').addEventListener('change', (e) => {

  const v = parseInt(e.target.value, 10);
  if (v === -1){

    addLog('INFO', 'quality → auto');
  } else {

    addLog('INFO', `quality → ${hls.levels[v]?.height || '?'}p`);

});

function getCachedExtract(id, ep, type){
  try {
    const raw = sessionStorage.getItem(extractKey(id, ep, type));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > EXTRACT_TTL_MS) return null;
    return data;
  } catch { return null; }
}
function cacheExtract(id, ep, type, data){
  try { sessionStorage.setItem(extractKey(id, ep, type), JSON.stringify({ data, ts: Date.now() })); } catch {}
}
function clearExtractCache(id, ep, type){
  try { sessionStorage.removeItem(extractKey(id, ep, type)); } catch {}
}
function getSticky(id, ep, type){
  try {
    const raw = localStorage.getItem(stickyKey(id, ep, type));
    if (!raw) return null;
    const { url, referer, ts } = JSON.parse(raw);
    if (Date.now() - ts > STICKY_TTL_MS) return null;
    return { url, referer, ts };
  } catch { return null; }
}
function saveSticky(id, ep, type, url, referer){

    localStorage.setItem(stickyKey(id, ep, type), JSON.stringify({ url, referer, ts: Date.now() }));

// ---------------- EXTRACT ----------------
async function tryProvider(ep, type, provider, nc){
  addLog('INFO', `prov: ${provider}${nc ? ' [fresh]' : ''}`);
  try {
    const data = await fetchJSON(
      `/anime/extract/${anilistId}?e=${ep}&type=${type}&provider=${provider}${nc}`,
      EXTRACT_TIMEOUT_MS, `extract:${provider}`
    );
    const stream = (data.streams || []).find(s => s.isActive !== false);
    if (!stream){ addLog('WARN', `${provider}: empty streams`); return null; }
    if (isEmbedStream(stream)){ addLog('WARN', `${provider}: embed only`); return null; }
    if (!isHlsStream(stream) && !isMp4Stream(stream)){ addLog('WARN', `${provider}: unknown "${stream.type}"`); return null; }
    addLog('OK', `✓ ${provider} → ${stream.type || 'hls'}`);
    return data;
  } catch(e){
    addLog('WARN', `${provider} failed: ${e.message}`);
    return null;
  }
}

async function fullRace(ep, type, { deep = false, nocache = false } = {}){
  const nc = nocache ? '&nocache=1' : '';
  const d  = deep ? '&deep=1' : '';
  const raceMs = deep ? DEEP_RACE_TIMEOUT_MS : FULL_RACE_TIMEOUT_MS;
  const label = deep ? `Deep race (${raceMs/1000}s)` : `Full race (${raceMs/1000}s)`;
  showOverlay('', false, label);
  setStatus('Racing providers', 'loading');
  addLog('INFO', `${deep ? 'DEEP' : 'FULL'} race ep=${ep}`);
  return await fetchJSON(`/anime/extract/${anilistId}?e=${ep}&type=${type}${nc}${d}`, raceMs + 5000, deep ? 'deep-race' : 'race');
}

async function extractFast(ep, type, { silent = false, nocache = false, deep = false } = {}){
  const cached = !nocache && getCachedExtract(anilistId, ep, type);
  if (cached){ addLog('INFO', `extract ep=${ep} [cache hit]`); return cached; }
  if (silent) return null;
  const nc = nocache ? '&nocache=1' : '';
  const provider = currentProvider;
  addLog('INFO', `using server: ${provider}`);
  const data = await tryProvider(ep, type, provider, nc);
  if (data){ cacheExtract(anilistId, ep, type, data); return data; }
  if (provider !== DEFAULT_PROVIDER) throw new Error(`Server "${provider}" has no playable stream.`);
  addLog('WARN', `${provider} empty — full race`);
  const raceData = await fullRace(ep, type, { deep, nocache });
  if (!raceData.streams?.length) throw new Error('No streams from any provider');
  cacheExtract(anilistId, ep, type, raceData);
  addLog('OK', `race won by ${raceData.provider}`);
  return raceData;
}

function proxyM3U8(url, referer){
  let p = `/p/m3u8?url=${encodeURIComponent(url)}`;
  if (referer) p += `&referer=${encodeURIComponent(referer)}`;
  return p;
}
function proxySeg(url, referer){
  let p = `/p/seg?url=${encodeURIComponent(url)}`;
  if (referer) p += `&referer=${encodeURIComponent(referer)}`;
  return p;
}

function getCachedEpisodes(id){
  try {
    const raw = sessionStorage.getItem(epsKey(id));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > EPS_TTL_MS) return null;
    return data;
  } catch { return null; }
}
function cacheEpisodes(id, data){
  try { sessionStorage.setItem(epsKey(id), JSON.stringify({ data, ts: Date.now() })); } catch {}
}
function episodesFor(type){
  if (episodes?.providers){
    for (const key of Object.keys(episodes.providers)){
      const list = episodes.providers[key]?.episodes?.[type];
      if (list?.length) return list;
    }
  }
  if (fakeEpisodes) return fakeEpisodes;
  return [];
}
function renderEpisodes(){
  const list = episodesFor(currentType);
  if (!list.length){
    epList.innerHTML = `<span class="hint">Loading episodes…</span>`;
    return;
  }
  epList.innerHTML = list.map(e =>
    `<button data-ep="${e.number}" class="${e.number===currentEp?'active':''}" title="Episode ${e.number}">${e.number}</button>`
  ).join('');
  const active = epList.querySelector('button.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
  epSource.textContent = episodes ? '' : 'estimated';
}
function pickFallbackEp(type){
  const list = episodesFor(type);
  if (!list.length) return null;
  return list.some(e => e.number===currentEp) ? currentEp : list[0].number;
}
async function loadEpisodesBackground(){
  const cached = getCachedEpisodes(anilistId);
  if (cached){
    episodes = cached;
    const fb = pickFallbackEp(currentType);
    if (fb && !params.get('ep')) currentEp = fb;
    renderEpisodes();
    addLog('INFO', 'episodes from cache');
    return;
  }
  addLog('INFO', 'loading episodes…');
  try {
    const data = await fetchJSON(`/anime/episodes/${anilistId}`, 130000, 'episodes');
    episodes = data;
    cacheEpisodes(anilistId, data);
    const fb = pickFallbackEp(currentType);
    if (fb && !params.get('ep')) currentEp = fb;
    renderEpisodes();
    addLog('OK', 'episodes loaded');
  } catch(e){
    addLog('ERROR', `episodes failed: ${e.message}`);
  }
}

// ---------------- OVERLAY ----------------
function showOverlay(msg, err=false, timerPrefix=null){
  overlay.innerHTML = '';
  overlay.classList.toggle('err', err);
  overlay.classList.remove('hidden');

  if (timerPrefix){
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    overlay.appendChild(spinner);

    const start = Date.now();
    const text = document.createElement('div');
    text.textContent = `${timerPrefix}… 0s`;
    text.style.cssText = 'margin-top:6px;font-size:13px;color:var(--muted);font-weight:500';
    overlay.appendChild(text);
    if (overlayTimer) clearInterval(overlayTimer);
    overlayTimer = setInterval(() => {
      text.textContent = `${timerPrefix}… ${Math.round((Date.now()-start)/1000)}s`;
    }, 1000);
  } else {
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    if (msg){
      const text = document.createElement('div');
      text.textContent = msg;
      overlay.appendChild(text);
    }
  }
}
function hideOverlay(){
  if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
  overlay.classList.add('hidden');
  overlay.innerHTML = '';
}

async function fetchJSON(url, ms = 30000, tag = ''){
  const t0 = performance.now();
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    const dt = Math.round(performance.now() - t0);
    let body = null;
    try { body = await r.json(); } catch {}
    if (!r.ok){
      addLog('WARN', `${tag} ${r.status} ${dt}ms`);
      const e = new Error(`HTTP ${r.status}`);
      e.status = r.status; e.body = body; e.timeout = !!body?.timeout;
      throw e;
    }
    addLog('INFO', `${tag} 200 ${dt}ms`);
    return body;
  } catch(e){
    if (e.name === 'AbortError'){
      addLog('ERROR', `${tag} TIMEOUT ${ms}ms`);
      const ne = new Error(`Timed out after ${ms/1000}s`);
      ne.timeout = true; ne.status = 0;
      throw ne;
    }
    throw e;
  } finally { clearTimeout(t); }
}

const isMp4Stream   = s => s?.type === 'mp4' || /\.mp4(\?|$)/i.test(s?.url || '');
const isEmbedStream = s => s?.type === 'embed';
const isHlsStream   = s => !s?.type || s.type === 'hls' || /\.m3u8(\?|$)/i.test(s?.url || '');

// ---------------- PLAY ----------------
function playFromData(data){
  const active = (data.streams || []).filter(s => s.isActive !== false);
  const stream = active.find(isHlsStream) || active.find(isMp4Stream) || active[0] || (data.streams && data.streams[0]);
  if (!stream){ showProviderError('any', 'No streams in response'); return; }

  const subs = stream.subtitles || data.subtitles || [];
  const provider = data.provider || currentProvider;
  addLog('INFO', `stream: ${provider} ${stream.type || 'hls'} subs=${subs.length}`);

  if (isEmbedStream(stream)){ showProviderError(provider, 'returned embed, not playable'); return; }

  setMetaBadge('meta-provider', provider);
  setMetaBadge('meta-quality', stream.type === 'mp4' ? 'MP4' : 'HLS');

  if (isHlsStream(stream)){
    if (overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
    showOverlay('Connecting…');
    setStatus('Loading HLS', 'loading');
    loadHls(proxyM3U8(stream.url, stream.referer), subs, stream.referer, provider, stream.url);
  } else if (isMp4Stream(stream)){
    showOverlay('Connecting (MP4)…', false);
    setStatus('Loading MP4', 'loading');
    loadMp4(stream, subs, provider);
  } else {
    showProviderError(provider, `unsupported type "${stream.type}"`);
  }
  history.replaceState(null, '', `?id=${anilistId}&ep=${currentEp}&type=${currentType}`);
}

async function play(nocache = false, { deep = false } = {}){
  if (busy) return;
  busy = true;

  resetTrackControls();

  const sticky = !nocache && getSticky(anilistId, currentEp, currentType);
  const stickyFresh = sticky && (Date.now() - (sticky.ts || 0) < STICKY_FRESH_MS);

  renderEpisodes();
  addLog('INFO', `play ep=${currentEp} type=${currentType} nocache=${nocache} deep=${deep}`);

  if (STREAM_URL_OVERRIDE){
    addLog('INFO', `override URL active`);
    setMetaBadge('meta-provider', 'override');
    showOverlay('Connecting to override…');
    setStatus('Override', 'loading');
    loadHls(proxyM3U8(STREAM_URL_OVERRIDE, STREAM_REF_OVERRIDE), [], STREAM_REF_OVERRIDE, 'override', STREAM_URL_OVERRIDE);
    busy = false;
    return;
  }

  // ═══ FAST PATH: fresh sticky URL — play immediately, no extract ═══
  if (stickyFresh){
    addLog('INFO', 'sticky fresh, playing immediately');
    setStatus('From cache', 'loading');
    setMetaBadge('meta-provider', 'sticky');
    showOverlay('Connecting from cache…');
    const stickyKind = /\.mp4(\?|$)/i.test(sticky.url) ? 'mp4' : 'hls';
    setMetaBadge('meta-quality', stickyKind.toUpperCase());
    if (stickyKind === 'mp4'){
      loadMp4({ url: sticky.url, referer: sticky.referer }, [], 'sticky');
    } else {
      loadHls(proxyM3U8(sticky.url, sticky.referer), [], sticky.referer, 'sticky', sticky.url);
    }
    busy = false;
    return;
  }

  setStatus('Extracting', 'loading');
  const cached = !nocache && getCachedExtract(anilistId, currentEp, currentType);
  showOverlay(cached ? 'Loading stream…' : '', false, cached ? null : 'Extracting stream');

  try {
    const data = await extractFast(currentEp, currentType, { nocache, deep });
    if (!data) throw new Error('No stream');
    playFromData(data);
  } catch(e){
    addLog('WARN', `extract failed: ${e.message}`);
    if (sticky){
      addLog('WARN', `using stale sticky URL as fallback`);
      showOverlay('Trying cached URL…');
      const sk = /\.mp4(\?|$)/i.test(sticky.url) ? 'mp4' : 'hls';
      setMetaBadge('meta-provider', 'sticky');
      setMetaBadge('meta-quality', sk.toUpperCase());
      if (sk === 'mp4'){
        loadMp4({ url: sticky.url, referer: sticky.referer }, [], 'sticky');
      } else {
        loadHls(proxyM3U8(sticky.url, sticky.referer), [], sticky.referer, 'sticky', sticky.url);
      }
    } else {
      addLog('ERROR', `play failed: ${e.message}`);
      showProviderError(currentProvider, e.message);
    }
  } finally { busy = false; }
}

// ---------------- ERROR ----------------
function showProviderError(provider, reason){
  if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
  clearStartupTimer();
  setStatus('Failed', 'error');

  overlay.classList.add('err');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;padding:0 20px;text-align:center">
      <div style="font-size:15px;font-weight:700">Stream failed · <span style="color:var(--accent2,#a78bfa)">${esc(provider)}</span></div>
      <div style="font-size:12px;opacity:.75;line-height:1.55">${esc(reason || 'Manifest did not load')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px">
        <button id="overlay-reload" class="btn-ghost" style="padding:10px 18px;max-width:120px">Reload</button>
        <button id="overlay-next" class="btn-ghost" style="padding:10px 18px;max-width:130px">Next server</button>
        <button id="overlay-back" class="btn-ghost" style="padding:10px 18px;max-width:100px">Back</button>
      </div>
    </div>`;

  const reloadBtn = document.getElementById('overlay-reload');
  if (reloadBtn) reloadBtn.addEventListener('click', () => location.reload());
  const nextBtn = document.getElementById('overlay-next');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const idx = PROVIDER_LIST.indexOf(currentProvider);
    const next = PROVIDER_LIST[(idx + 1) % PROVIDER_LIST.length];
    currentProvider = next;
    try { sessionStorage.setItem(PROVIDER_STORAGE_KEY, currentProvider); } catch {}
    const sel = document.getElementById('provider-select');
    if (sel) sel.value = currentProvider;
    clearExtractCache(anilistId, currentEp, currentType);
    play(true, { deep: false });
  });
  const backBtn = document.getElementById('overlay-back');
  if (backBtn) backBtn.addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = './index.html';
  });
}

video.addEventListener('error', () => {
  if (!video.error) return;
  const codes = { 1: 'Aborted', 2: 'Network error', 3: 'Decode error', 4: 'Format not supported' };
  const msg = codes[video.error.code] || `Error ${video.error.code}`;
  addLog('ERROR', `video.error: ${msg}`);
  if (video.readyState === 0) showProviderError(currentProvider, msg);
});

// ---------------- MP4 ----------------
function loadMp4(stream, subs, provider){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  attachSubtitles(subs, stream.referer);
  video.src = proxySeg(stream.url, stream.referer);
  video.load();

  startupTimer = setTimeout(() => {
    if (video.readyState < 2) {
      if (provider === 'sticky'){
        addLog('WARN', 'sticky MP4 timeout, extracting');
        clearSticky(anilistId, currentEp, currentType);
        hideOverlay();
        play(true, { deep: false });
        return;
      }
      showProviderError(provider, 'MP4 source did not start');
    }
  }, 15000);

  const onPlaying = () => {
    clearStartupTimer(); hideOverlay();
    setStatus('Playing', 'playing');
    saveSticky(anilistId, currentEp, currentType, stream.url, stream.referer);
    updateAudioTracks();
    video.removeEventListener('playing', onPlaying);
  };
  video.addEventListener('playing', onPlaying);
  video.play().catch(()=>{});
}

// ---------------- HLS ----------------
function loadHls(src, subs, referer, provider, rawUrl){
  if (hls){ hls.destroy(); hls = null; }
  clearStartupTimer();
  video.removeAttribute('src'); video.load();
  attachSubtitles(subs, referer);

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      debug: false,

      // Fast startup: begin at lowest level so first fragment is tiny
      startLevel: 0,
      testBandwidth: false,
      startFragPrefetch: true,
      abrEwmaDefaultEstimate: 500000,
      abrBandWidthFactor: 0.95,
      abrBandWidthUpFactor: 0.75,

      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      maxBufferSize: 60 * 1000 * 1000,
      maxBufferHole: 0.5,
      backBufferLength: 30,

      manifestLoadingTimeOut: 12000,
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 500,
      manifestLoadingMaxRetryTimeout: 64000,

      levelLoadingTimeOut: 20000,
      levelLoadingMaxRetry: 6,
      levelLoadingRetryDelay: 500,
      levelLoadingMaxRetryTimeout: 64000,

      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 8,
      fragLoadingRetryDelay: 500,
      fragLoadingMaxRetryTimeout: 64000,

      appendErrorMaxRetry: 5,
      maxStarvationDelay: 4,
      maxLoadingDelay: 4,

      enableWebVTT: true,
      enableIMSC1: false,
      enableCEA708Captions: false,
    });
    hls.loadSource(src);
    hls.attachMedia(video);

    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => {
      addLog('INFO', `audio tracks: ${hls.audioTracks?.length || 0}`);
      updateAudioTracks();
    });
    hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, () => updateAudioTracks());

    startupTimer = setTimeout(() => {
      if (video.readyState < 2){
        addLog('ERROR', `startup timeout ${STARTUP_TIMEOUT_MS/1000}s`);
        if (provider === 'sticky'){
          addLog('WARN', 'sticky startup timeout, extracting');
          clearSticky(anilistId, currentEp, currentType);
          if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
          hideOverlay();
          play(true, { deep: false });
          return;
        }
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);

    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => {
      addLog('OK', `HLS manifest: ${d.levels?.length ?? '?'} levels`);
      const heights = (hls.levels || []).map(l => l.height).filter(h => h > 0);
      if (heights.length){
        const maxH = Math.max(...heights);
        if (maxH) setMetaBadge('meta-quality', `${maxH}p`);
      }
      updateAudioTracks();
      populateQualityDropdown();
      showOverlay('Buffering…');
      video.play().catch(()=>{});
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => {
      const h = hls.levels?.[d.level]?.height;
      if (h) setMetaBadge('meta-quality', `${h}p`);
    });

    const onPlaying = () => {
      clearStartupTimer(); hideOverlay();
      setStatus('Playing', 'playing');
      if (rawUrl) saveSticky(anilistId, currentEp, currentType, rawUrl, referer);
      video.removeEventListener('playing', onPlaying);
    };
    video.addEventListener('playing', onPlaying);

    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      addLog('ERROR', `HLS fatal: ${d.type} / ${d.details}`);
      clearStartupTimer();

      // ═══ Sticky failed → fall back to fresh extract ═══
      if (provider === 'sticky'){
        addLog('WARN', 'sticky failed, extracting');
        clearSticky(anilistId, currentEp, currentType);
        if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
        hideOverlay();
        play(true, { deep: false });
        return;
      }

      if (/manifest/i.test(d.details || '')){
        if (hls){ try { hls.destroy(); } catch(_){} hls = null; }
        clearSticky(anilistId, currentEp, currentType);
        showProviderError(provider, `Manifest did not load (${d.details})`);
        return;
      }
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR){
        showOverlay('Network error, retrying…', true);
        try { hls.startLoad(); } catch(_) {}
        return;
      }
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR){
        showOverlay('Media error, recovering…', true);
        try { hls.recoverMediaError(); }
        catch(_){
          try { hls.swapAudioCodec(); hls.recoverMediaError(); }
          catch(_){ showProviderError(provider, `Playback failed: ${d.details}`); }
        }
        return;
      }
      showProviderError(provider, `Playback failed: ${d.details}`);
    });

  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    addLog('INFO', 'using native HLS');
    video.src = src;
    startupTimer = setTimeout(() => {
      if (video.readyState < 2) {
        if (provider === 'sticky'){
          addLog('WARN', 'sticky native timeout, extracting');
          clearSticky(anilistId, currentEp, currentType);
          hideOverlay();
          play(true, { deep: false });
          return;
        }
        showProviderError(provider, `Stream did not start within ${STARTUP_TIMEOUT_MS/1000}s`);
      }
    }, STARTUP_TIMEOUT_MS);
    const onPlaying = () => {
      clearStartupTimer(); hideOverlay();
      setStatus('Playing', 'playing');
      if (rawUrl) saveSticky(anilistId, currentEp, currentType, rawUrl, referer);
      updateAudioTracks();
      video.removeEventListener('playing', onPlaying);
    };
    video.addEventListener('playing', onPlaying);
    video.play().catch(()=>{});
  } else {
    showProviderError(provider, 'HLS not supported in this browser');
  }
}

// ---------------- META ----------------
async function loadMeta(){
  try {
    const info = await fetchJSON(`/anime/info/${anilistId}`, 30000, 'info');
    const title = (typeof info.title === 'object' && info.title)
      ? (info.title.english || info.title.romaji || info.title.native || info.title.userPreferred)
      : null;
    const t = title || info.title || `Anime #${anilistId}`;

    $('#title').textContent = t;
    $('#header-title').textContent = t;
    document.title = t + ' · Player';

    const coverUrl = info.coverImage?.extraLarge
                  || info.coverImage?.large
                  || info.coverImage?.medium
                  || info.bannerImage
                  || PLACEHOLDER;

    const coverEl = $('#cover');
    coverEl.classList.add('loading');
    coverEl.onerror = () => { coverEl.src = PLACEHOLDER; coverEl.classList.remove('loading'); coverEl.classList.add('placeholder'); };
    coverEl.onload  = () => { coverEl.classList.remove('loading'); };
    coverEl.src = coverUrl;

    const poster = info.bannerImage || info.coverImage?.extraLarge || info.coverImage?.large || PLACEHOLDER;
    video.poster = poster;

    const bits = [];
    if (info.format) bits.push(info.format);
    if (info.seasonYear) bits.push(String(info.seasonYear));
    if (info.episodes) bits.push(`${info.episodes} ep`);
    if (info.averageScore) bits.push(`${info.averageScore}%`);
    $('#subtitle').textContent = bits.join(' · ');

    if (info.episodes > 0 && !episodes){
      fakeEpisodes = Array.from({ length: info.episodes }, (_, i) => ({ number: i + 1 }));
      renderEpisodes();
    }
  } catch(e){
    addLog('WARN', `meta failed: ${e.message}`);
    const fallback = `Anime #${anilistId}`;
    $('#title').textContent = fallback;
    $('#header-title').textContent = fallback;
    $('#cover').src = PLACEHOLDER;
  }
}

// ---------------- EVENTS ----------------
epList.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-ep]');
  if (!b) return;
  const n = Number(b.dataset.ep);
  if (n === currentEp) return;
  currentEp = n;

  const card = document.getElementById('episodes-card');
  if (card && !card.classList.contains('expanded')){
    setEpisodesExpanded(true);
  } else {
    setTimeout(() => {
      const active = document.querySelector('.ep-list button.active');
      if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }, 50);
  }

  play();
});

$('#retry').addEventListener('click', () => {
  clearExtractCache(anilistId, currentEp, currentType);
  addLog('WARN', 'manual retry');
  play(true, { deep: false });
});

// ---------------- BOOT ----------------
(async function boot(){
  if (!anilistId){ showOverlay('Missing ?id= in URL', true); return; }
  addLog('INFO', `anilistId=${anilistId} ep=${startEp} type=${startType} provider=${currentProvider}`);
  if (STREAM_URL_OVERRIDE) addLog('INFO', 'STREAM_URL_OVERRIDE active');
  loadMeta();
  loadEpisodesBackground();
  play();
})();
</script>
